            { name: "Sort Color Water Puzzle", thumbnail: "https://www.dropbox.com/scl/fi/faas6hyyixybiyj2x44ue/file_0000000070e8820683570f0d98c63931.png?rlkey=h2svk45vq5ag0q10wzhippucb&raw=1", gameUrl: "https://html5.gamemonetize.games/tji0kvqoftggeanohsx75fatit8vb9b8/" },
            { name: "Kim Jong Un Backroom", thumbnail: "https://www.dropbox.com/scl/fi/9aqkpvjl15vvdoiwc5rrg/file_000000001b288211b286ea374edc61b3.png?rlkey=ndl46xbel3b15pryk6fu6ip72&raw=1", gameUrl: "https://html5.gamemonetize.games/ovdr36phl8kni2mh8qop0ml5992qk0iv/" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderGames(filter = '') {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            let gamesToRender = [...games];
            
            // Shuffle on initial load or when search is empty to keep it fresh
            if (filter === '') {
                gamesToRender = shuffleArray(gamesToRender);
            } else {
                gamesToRender = gamesToRender.filter(g => g.name.toLowerCase().includes(filter.toLowerCase()));
            }
            
            if (gamesToRender.length === 0) {
                grid.innerHTML = '<p class="no-results">No games found matching your search.</p>';
                return;
            }

            gamesToRender.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumb-wrapper">
                        <div class="card-spinner"></div>
                        <img src="${game.thumbnail}" class="game-thumb" alt="${game.name}" loading="lazy" decoding="async" onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none';" onerror="this.previousElementSibling.style.display='none'; this.parentElement.classList.add('img-error');">
                    </div>
                    <div class="game-name">${game.name}</div>
                `;
                card.onclick = () => {
                    window.location.href = 'index.html?game=' + encodeURIComponent(game.gameUrl);
                };
                grid.appendChild(card);
            });
        }

        function filterGames() {
            const input = document.getElementById('searchInput');
            renderGames(input.value);
        }

        document.addEventListener('DOMContentLoaded', () => renderGames());
    </script>
</body>
</html>

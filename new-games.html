<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>New Games - AstraSpin</title>
<meta name="description" content="Play the latest and newest HTML5 games added to AstraSpin. Fresh games updated regularly for your entertainment.">
<link rel="canonical" href="https://astraspin.in/new-games.html" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff9500'/%3E%3Cpath d='M50 20L58 40H78L62 52L68 72L50 60L32 72L38 52L22 40H42Z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9671316621072835" crossorigin="anonymous"></script>
<style>
:root{--bg-primary:#f0f7ff;--bg-secondary:#fff;--text-dark:#2d2d2d;--text-medium:#555;--text-light:#888;--accent-orange:#ff9500;--accent-orange-dark:#e67e00;--border-light:#e0e8f0;--safe-top:env(safe-area-inset-top,0px);--shadow-card:0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.05)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-dark);position:fixed;top:0;left:0;right:0;bottom:0;-webkit-font-smoothing:antialiased}
.app-wrapper{position:relative;width:100%;height:100%;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page-container{max-width:1200px;margin:0 auto;padding:20px 16px;padding-top:calc(20px + var(--safe-top));padding-bottom:40px}
.page-header{display:flex;align-items:center;gap:15px;margin-bottom:30px}
.back-btn{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,0.1);border:3px solid var(--accent-orange)}
.back-btn svg{width:24px;height:24px;color:var(--accent-orange-dark)}
.page-title{font-family:'Fredoka',sans-serif;font-size:34px;font-weight:700;color:var(--text-dark)}
.section-title{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:700;color:var(--text-dark);margin-bottom:24px;padding-left:10px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:8px;height:28px;background:var(--accent-orange);border-radius:4px;display:inline-block;box-shadow:2px 2px 0 rgba(0,0,0,0.1)}
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(min-width:600px){.games-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.games-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.games-grid{grid-template-columns:repeat(5,1fr)}}
.game-card{background:#fff;border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1);position:relative;box-shadow:var(--shadow-card);border:4px solid #fff;text-decoration:none}
.game-card:hover{transform:translateY(-8px) rotate(-2deg)}
.game-card:active{transform:scale(.98)}
.game-thumb-wrapper{width:100%;height:150px;background:var(--bg-primary);position:relative;overflow:hidden}
.game-thumb{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.game-thumb.loaded{opacity:1}
.card-spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border:4px solid rgba(255,149,0,.2);border-top-color:var(--accent-orange);border-radius:50%;animation:spin .8s linear infinite;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.img-error{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);color:var(--text-light);font-size:24px}
.game-name{font-size:16px;font-weight:700;color:var(--text-dark);padding:16px 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Fredoka',sans-serif}
#externalGameModal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999;display:none}
#externalGameModal.active{display:block}
.external-modal-content{width:100%;height:100%;position:relative;background:#000;overflow:hidden}
#externalGameFrame{width:100%;height:100%;border:none;display:block}
#iframeLoader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;display:flex;flex-direction:column;align-items:center;gap:15px}
.loader-spinner{width:50px;height:50px;border:5px solid rgba(255,255,255,.2);border-top-color:var(--accent-orange);border-radius:50%;animation:spin 1s linear infinite}
#wrapperBackBtn{position:absolute;top:calc(15px + env(safe-area-inset-top,0px));left:calc(15px + env(safe-area-inset-left,0px));width:40px;height:40px;padding:10px;background:rgba(255,255,255,.3);backdrop-filter:blur(10px);border-radius:50%;border:none;color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:1001;box-sizing:content-box}
#wrapperBackBtn svg{width:28px;height:28px}
#wrapperBackBtn.active{display:flex}
</style>
</head>
<body>
<div class="app-wrapper">
<div id="wrapperBackBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
<div class="page-container">
<div class="page-header">
<a href="index.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
<div class="page-title">New Games</div>
</div>
<h2 class="section-title">Latest Additions</h2>
<div class="games-grid" id="gamesGrid"></div>
</div>
<div id="externalGameModal"><div class="external-modal-content"><div id="iframeLoader"><div class="loader-spinner"></div></div><iframe id="externalGameFrame" src="" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen="true" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-modals"></iframe></div></div>
</div>
<script>
let games = [];
let isGameOpen=false;let currentGameUrl='';let iframeTimeout=null;

// Fetch central game data from index.html
async function fetchGameData() {
    try {
        const res = await fetch('index.html', {cache: 'no-cache'});
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        return JSON.parse(doc.getElementById('game-database').textContent);
    } catch(e) {
        console.error("Failed to load game data", e);
        return [];
    }
}

function openGame(url){if(!url||isGameOpen)return;isGameOpen=true;currentGameUrl=url;document.getElementById('externalGameFrame').src=url;document.getElementById('externalGameModal').classList.add('active');document.getElementById('wrapperBackBtn').classList.add('active');document.getElementById('iframeLoader').style.display='flex';clearTimeout(iframeTimeout);iframeTimeout=setTimeout(()=>{document.getElementById('iframeLoader').innerHTML='<div class="loader-spinner"></div>';},10000);}
function closeExternalGame(){isGameOpen=false;document.getElementById('externalGameModal').classList.remove('active');document.getElementById('wrapperBackBtn').classList.remove('active');setTimeout(()=>{document.getElementById('externalGameFrame').src='about:blank';document.getElementById('iframeLoader').innerHTML='<div class="loader-spinner"></div>';},100);}
document.getElementById('externalGameFrame').addEventListener('load',function(){clearTimeout(iframeTimeout);document.getElementById('iframeLoader').style.display='none';});
document.getElementById('wrapperBackBtn').addEventListener('click',closeExternalGame);

function renderNewGames(){const grid=document.getElementById('gamesGrid');grid.innerHTML='';const seen=new Set();let newGames=games.filter(g=>g.isNew);if(newGames.length===0){grid.innerHTML='<p style="text-align:center;color:var(--text-light);font-size:18px;margin:40px 0;font-family:Fredoka,sans-serif;">No new games yet. Check back soon!</p>';return;}newGames.forEach((g)=>{if(seen.has(g.gameUrl))return;seen.add(g.gameUrl);const c=document.createElement('div');c.className='game-card';c.innerHTML=`<div class="game-thumb-wrapper"><div class="card-spinner"></div><img src="${g.thumbnail}" class="game-thumb" alt="${g.name}" loading="lazy" decoding="async" onload="this.classList.add('loaded');this.previousElementSibling.style.display='none';" onerror="this.previousElementSibling.style.display='none';this.parentElement.classList.add('img-error');"></div><div class="game-name">${g.name}</div>`;c.onclick=()=>openGame(g.gameUrl);grid.appendChild(c);});}

document.addEventListener('DOMContentLoaded', async function() {
    games = await fetchGameData();
    renderNewGames();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E7D43">
<title>Jungle Tushar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita One&display=swap" rel="stylesheet">
<style>
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Baloo 2',sans-serif;color:#3A2A1E;
  background:linear-gradient(#8FD3F0 0%,#B8E5F6 45%,#D8F0E2 78%,#CBE9C9 100%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  overscroll-behavior:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
svg{display:block}
:root{
  --outline:#4A2F17; --ink:#3A2A1E;
  --wood:#8B5A2B; --wood-d:#5E3A16; --wood-l:#C89457;
  --green:#3E9B4F; --green-d:#2A7038; --green-l:#66BB6A;
  --amber:#F2B234; --amber-d:#C08414;
  --red:#D64545; --red-d:#A83232;
  --cream:#F8EDD4; --cream-d:#EBD9AE;
  --cellA:#F7E8C8; --cellB:#EBCF9E; --frame:#8B5A2B; --frame-d:#5E3A16;
  --panel:#F8EDD4;
}
/* ============ SCENERY ============ */
#scenery{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
#groundSvg{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}
.vine{position:absolute;top:0;transform-origin:top center;animation:sway 6.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
#sun{position:absolute;top:4vh;right:6vw;animation:sunPulse 5s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
body.dim-scenery #scenery{opacity:.45;transition:opacity .4s}
/* ============ LAYOUT ============ */
#app{position:relative;z-index:2;height:100dvh;max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.screen.active{display:flex}
/* ============ TOP BARS / PILLS ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(58,42,30,.88);color:#FFD966;
  padding:7px 14px 7px 9px;border-radius:999px;font-weight:800;font-size:17px;
  box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.15)}
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--wood);border:2.5px solid var(--outline);
  display:flex;align-items:center;justify-content:center;color:#FFE9C4;flex:none;
  box-shadow:0 4px 0 var(--wood-d), inset 0 2px 0 rgba(255,255,255,.25);transition:transform .08s,box-shadow .08s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-d), inset 0 2px 0 rgba(255,255,255,.25)}
.screen-head{display:flex;align-items:center;gap:10px;flex:0 0 auto;margin-bottom:10px}
.screen-title{font-family:'Lilita One';font-size:24px;color:#2E4A22;text-shadow:0 2px 0 rgba(255,255,255,.6);flex:1;text-align:center;letter-spacing:.5px}
/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-weight:800;font-size:19px;color:#fff;background:var(--green);
  border:2.5px solid var(--outline);border-radius:18px;padding:13px 28px;
  box-shadow:0 5px 0 var(--green-d),0 9px 16px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.32);
  transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d),inset 0 2px 0 rgba(255,255,255,.32)}
.btn.wood{background:var(--wood);box-shadow:0 5px 0 var(--wood-d),0 9px 16px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.25)}
.btn.wood:active{box-shadow:0 1px 0 var(--wood-d),inset 0 2px 0 rgba(255,255,255,.25)}
.btn.amber{background:var(--amber);color:#5E3A16;box-shadow:0 5px 0 var(--amber-d),0 9px 16px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.amber:active{box-shadow:0 1px 0 var(--amber-d),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d),0 9px 16px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.28)}
.btn.red:active{box-shadow:0 1px 0 var(--red-d),inset 0 2px 0 rgba(255,255,255,.28)}
.btn.small{font-size:15px;padding:8px 16px;border-radius:13px}
.btn.block{width:100%}
.btn:disabled{filter:saturate(.35) brightness(.85);pointer-events:none}
/* ============ PREMIUM PLAY BUTTON ============ */
.btn-play-big{
  position:relative;display:flex;align-items:center;justify-content:center;gap:14px;
  width:min(84vw,320px);min-height:76px;overflow:hidden;
  font-family:'Lilita One';font-size:32px;letter-spacing:3px;color:#fff;
  background:linear-gradient(180deg,#8ADE6F 0%,#3E9B4F 52%,#2E7D3C 100%);
  border:3.5px solid #23491C;border-radius:30px;
  box-shadow:0 8px 0 #1E5429,0 16px 30px rgba(20,60,15,.35),inset 0 4px 0 rgba(255,255,255,.5),inset 0 -7px 0 rgba(0,0,0,.16);
  text-shadow:0 3px 0 rgba(20,60,15,.55);
  transition:transform .1s,box-shadow .1s,filter .1s;
  animation:playPulse 2.4s ease-in-out infinite;
  touch-action:manipulation;
}
.btn-play-big .tr{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#FFF3C2,#FFD23D 70%);
  border:3px solid #C4922A;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #C4922A,inset 0 2px 0 rgba(255,255,255,.8);
}
.btn-play-big .tr svg{margin-left:3px}
.btn-play-big::before{
  content:'';position:absolute;top:-20%;left:-30%;width:34%;height:140%;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.38) 50%,transparent 80%);
  transform:skewX(-18deg);animation:shine 3.2s ease-in-out infinite;
}
@keyframes shine{0%,55%{left:-40%}75%,100%{left:130%}}
@keyframes playPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn-play-big:active{transform:translateY(6px) scale(.99);animation:none;
  box-shadow:0 2px 0 #1E5429,0 5px 12px rgba(20,60,15,.3),inset 0 4px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.14)}
/* ============ HOME ============ */
#scr-home{align-items:center;justify-content:space-between}
#signSlot{width:min(88vw,390px);flex:0 0 auto;margin-top:2vh}
.signSway{transform-box:view-box;transform-origin:190px 98px;animation:sway 5.8s ease-in-out infinite}
#heroWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;padding:4px 0}
#heroTushar{width:min(50vw,225px)}
.menu{flex:0 0 auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:2.5vh}
.home-foot{font-size:12px;color:rgba(58,42,30,.55);font-weight:600;text-align:center}
/* ============ TUSHAR ============ */
.tushar{--fur:#B97E46;--furD:#8F5E2B;--furL:#E9BC80;--belly:#F8EDD4;--inner:#F2A9B8;overflow:visible}
.tushar.golden{--fur:#E9C358;--furD:#BE8F2C;--furL:#FBE9A9}
.tushar .figure{transform-box:fill-box;transform-origin:50% 90%;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tushar .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93.5%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.tushar .halo{opacity:0;transform-box:fill-box;transform-origin:center}
.tushar.auraOn .halo{opacity:1;animation:haloPulse 2.8s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.05)}}
.tushar.rainbowtail .tailPath{stroke:url(#jtRainbow)}
/* ============ PANELS / SCROLL AREAS ============ */
.woodpanel{background:var(--cream);border:3px solid var(--wood-d);border-radius:22px;
  box-shadow:0 6px 0 rgba(74,47,23,.45),0 12px 24px rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.7);
  background-image:repeating-linear-gradient(98deg,rgba(139,90,43,.055) 0 3px,transparent 3px 26px)}
.scrollarea{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 2px 14px}
.scrollarea::-webkit-scrollbar{width:8px}
.scrollarea::-webkit-scrollbar-thumb{background:rgba(139,90,43,.4);border-radius:99px}
.scrollarea::-webkit-scrollbar-track{background:transparent}
/* ============ LEVEL SELECT ============ */
.chap-tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px;flex:0 0 auto;scrollbar-width:none}
.chap-tabs::-webkit-scrollbar{display:none}
.chap-tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--cream);border:2.5px solid var(--wood-d);
  border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--ink);
  box-shadow:0 3px 0 rgba(74,47,23,.4);transition:transform .08s}
.chap-tab:active{transform:translateY(2px)}
.chap-tab.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.chap-tab.locked{opacity:.72;color:#8a7a63}
.lvl-progress{flex:0 0 auto;margin:0 2px 10px;background:rgba(58,42,30,.14);border-radius:99px;height:20px;position:relative;overflow:hidden}
.lvl-progress i{position:absolute;inset:0;width:0;background:linear-gradient(#79C97F,#3E9B4F);border-radius:99px;transition:width .5s cubic-bezier(.3,1.2,.5,1)}
.lvl-progress span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#2E4A22;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.continue-bar{flex:0 0 auto;margin:0 2px 12px}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:11px;padding:2px}
.lvl-cell{position:relative;aspect-ratio:1;border-radius:16px;border:2.5px solid var(--wood-d);
  background:var(--cream);box-shadow:0 4px 0 rgba(74,47,23,.4),inset 0 2px 0 rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:'Lilita One';font-size:21px;color:var(--ink);transition:transform .08s}
.lvl-cell:active{transform:scale(.94)}
.lvl-cell .st{display:flex;gap:1.5px}
.lvl-cell.done{background:#CFE9C2;border-color:#2A7038;box-shadow:0 4px 0 #1E5429,inset 0 2px 0 rgba(255,255,255,.6)}
.lvl-cell.cur{background:var(--amber);border-color:#8a6a2a;box-shadow:0 4px 0 var(--amber-d),0 0 0 4px rgba(242,178,52,.35),inset 0 2px 0 rgba(255,255,255,.5);animation:curPulse 1.6s ease-in-out infinite}
@keyframes curPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.lvl-cell.locked{background:#B9AE96;border-color:#6f6250;box-shadow:0 4px 0 #57493a;color:#7d715c;cursor:default}
.lvl-cell .lvtag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;
  font-family:'Baloo 2';font-weight:800;font-size:10.5px;padding:1px 9px;border-radius:99px;border:2px solid var(--outline);white-space:nowrap}
/* ============ GAME — compact card system ============ */
#scr-game{padding-left:8px;padding-right:8px;gap:0}
.gcard{
  background:var(--cream);border:2.5px solid var(--wood-d);border-radius:13px;
  box-shadow:0 3px 0 rgba(74,47,23,.4),0 5px 10px rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.7);
  background-image:repeating-linear-gradient(98deg,rgba(139,90,43,.05) 0 3px,transparent 3px 24px);
}
.hud{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.hud-row{display:flex;align-items:center;gap:6px}
.pausebtn{
  width:38px;height:38px;flex:none;border-radius:50%;
  background:var(--wood);border:2.5px solid var(--outline);color:#FFE9C4;
  display:flex;align-items:center;justify-content:center;align-self:center;
  box-shadow:0 3px 0 var(--wood-d),inset 0 2px 0 rgba(255,255,255,.25);
  transition:transform .08s,box-shadow .08s;
}
.pausebtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d),inset 0 2px 0 rgba(255,255,255,.25)}
.hud-lv{display:flex;align-items:center;gap:5px;padding:4px 10px;font-weight:800;font-size:12.5px;color:var(--ink)}
.hud-lv b{font-family:'Lilita One';font-size:15px;letter-spacing:.3px}
.coinpill-sm{display:inline-flex;align-items:center;gap:4px;background:rgba(58,42,30,.88);color:#FFD966;
  padding:4px 9px 4px 6px;border-radius:999px;font-weight:800;font-size:13.5px;margin-left:auto;
  box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.coinpill-sm svg{width:14px;height:14px}
.moves-box{margin-left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 12px;min-width:64px;gap:0}
.moves-box .mrow{display:flex;align-items:center;gap:4px}
.moves-box .mrow span{font-size:8.5px;font-weight:800;letter-spacing:.7px;color:#8a7a63}
.moves-box .mrow svg{width:11px;height:11px}
.moves-box b{font-family:'Lilita One';font-size:19px;line-height:1.05;color:var(--red)}
.moves-box b.low{animation:lowPulse .8s ease-in-out infinite}
@keyframes lowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.target-panel{flex:1;min-width:0;padding:5px 10px 6px;display:flex;flex-direction:column;gap:2px}
.tp-head{display:flex;align-items:center;justify-content:space-between}
.tp-head .lbl{font-size:9px;font-weight:800;letter-spacing:.8px;color:#8a7a63;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tp-head .lbl svg{width:11px;height:11px}
.tp-stars{position:relative;height:17px;margin:0 6px}
.tp-stars .ts{position:absolute;top:0;transform:translateX(-50%);transition:transform .2s}
.tp-stars .ts svg{width:15px;height:15px}
.tp-stars .ts.lit{animation:starPop .4s cubic-bezier(.3,2,.5,1)}
@keyframes starPop{0%{transform:translateX(-50%) scale(.4)}70%{transform:translateX(-50%) scale(1.5)}100%{transform:translateX(-50%) scale(1)}}
.tp-bar{height:10px;background:rgba(58,42,30,.16);border-radius:99px;overflow:hidden}
.tp-bar i{display:block;height:100%;width:0;background:linear-gradient(#FFD966,#F2A03D);border-radius:99px;transition:width .35s ease}
.tp-num{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:#8a7a63}
.tp-num #tpScore{color:#B8860B}
#boardWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#boardFrame{padding:8px;border-radius:18px;background:var(--frame);border:3px solid var(--outline);
  box-shadow:0 7px 0 var(--frame-d),0 14px 24px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.22)}
/* board & tiles: touch-action NONE so the browser never hijacks the swipe.
   transition: NO overshoot — tiles land exactly on target, never wiggle past it */
#board{position:relative;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.06);touch-action:none}
.tile{position:absolute;top:0;left:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
  transition:transform .24s cubic-bezier(.3,.9,.4,1);touch-action:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.09),inset 0 2px 0 rgba(255,255,255,.28)}
.tile:active{filter:brightness(1.06)}
.tile .pc,.tile .ring{position:absolute;inset:6%;width:88%;height:88%}
.tile .ring{inset:0;width:100%;height:100%;animation:spin 3.2s linear infinite;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 5px rgba(255,214,90,.9))}
@keyframes spin{to{transform:rotate(360deg)}}
.tile.pop{animation:tilePop .22s ease-in forwards;z-index:5}
@keyframes tilePop{40%{transform:var(--tf) scale(1.15)}100%{transform:var(--tf) scale(0) rotate(30deg);opacity:0}}
.tile.selected{box-shadow:inset 0 -3px 0 rgba(0,0,0,.09),inset 0 2px 0 rgba(255,255,255,.28),0 0 0 3px var(--amber);z-index:4}
.tile.hintp{animation:hintP .7s ease-in-out infinite}
@keyframes hintP{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
#board.targeting{outline:4px solid var(--amber);outline-offset:2px;animation:hintP 1s infinite}
.goldtrail .tile{transition:transform .24s cubic-bezier(.3,.9,.4,1),filter .24s}
.goldtrail .tile.moving{filter:drop-shadow(0 0 7px rgba(255,205,80,.95))}
.boosterbar{flex:0 0 auto;display:flex;justify-content:center;gap:9px;padding-top:7px}
.boostbtn{position:relative;width:56px;padding:6px 0 4px;border-radius:14px;background:var(--cream);border:2.5px solid var(--wood-d);
  box-shadow:0 3px 0 rgba(74,47,23,.4),inset 0 2px 0 rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;gap:0;color:var(--wood-d);transition:transform .08s}
.boostbtn svg{width:20px;height:20px}
.boostbtn .bl{font-size:8.5px;font-weight:800;letter-spacing:.3px;color:#8a7a63}
.boostbtn:active{transform:translateY(2px)}
.boostbtn.armed{background:var(--amber);box-shadow:0 3px 0 var(--amber-d),0 0 0 4px rgba(242,178,52,.4)}
.boostbtn.empty{opacity:.45}
.boostbtn .cnt{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  min-width:20px;height:20px;border-radius:99px;border:2px solid var(--outline);display:flex;align-items:center;justify-content:center;padding:0 4px}
#boardMsg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(58,42,30,.9);color:#FFE9C4;
  font-weight:800;font-size:13px;padding:5px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#boardMsg.show{opacity:1}
/* ============ STORE ============ */
.store-tabs{display:flex;gap:8px;overflow-x:auto;flex:0 0 auto;padding:2px 2px 11px;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.store-tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--cream);border:2.5px solid var(--wood-d);
  border-radius:13px;padding:7px 13px;font-weight:800;font-size:13.5px;color:var(--ink);box-shadow:0 3px 0 rgba(74,47,23,.4);transition:transform .08s}
.store-tab:active{transform:translateY(2px)}
.store-tab.on{background:var(--wood);color:#FFE9C4;box-shadow:0 3px 0 var(--wood-d)}
.store-preview{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin:0 2px 10px;padding:9px 14px}
.store-preview .tushar-slot{width:74px;flex:0 0 auto}
.store-preview h4{font-family:'Lilita One';font-size:17px;color:#2E4A22}
.store-preview p{font-size:12.5px;font-weight:600;color:#8a7a63;line-height:1.25}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;padding:2px}
.shop-card{background:var(--cream);border:2.5px solid var(--wood-d);border-radius:18px;padding:12px 10px;
  box-shadow:0 4px 0 rgba(74,47,23,.4),inset 0 2px 0 rgba(255,255,255,.7);
  display:flex;flex-direction:column;gap:7px;transition:transform .1s}
.shop-card:active{transform:scale(.975)}
.shop-card .ic{width:56px;height:56px;border-radius:14px;background:#F1E0B8;border:2px solid rgba(139,90,43,.35);
  display:flex;align-items:center;justify-content:center;margin:0 auto}
.shop-card .ic svg{width:44px;height:44px}
.shop-card h5{font-size:14px;font-weight:800;text-align:center;line-height:1.15}
.shop-card .ds{font-size:11.5px;font-weight:600;color:#8a7a63;text-align:center;line-height:1.3;min-height:29px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shop-card .row{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.pricechip{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14.5px;color:#7A5205}
.ownedtag{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;color:var(--green-d)}
.lockrow{display:flex;align-items:center;gap:5px;font-weight:800;font-size:12px;color:#8a7a63;justify-content:center}
.eqbadge{background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;border:2px solid var(--outline)}
/* ============ SETTINGS MENU ============ */
.set-hero{display:flex;flex-direction:column;align-items:center;gap:2px;margin:-4px 0 12px}
.set-hero .tushar-slot{width:92px}
.set-hero h3{font-family:'Lilita One';font-size:23px;color:#2E4A22}
.set-navcol{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.set-nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fff;border:2.5px solid var(--wood-d);border-radius:16px;padding:11px 14px;
  box-shadow:0 4px 0 rgba(74,47,23,.35),inset 0 2px 0 rgba(255,255,255,.8);transition:transform .08s}
.set-nav:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,47,23,.35)}
.set-nav .snic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(74,47,23,.35)}
.set-nav .snic svg{width:26px;height:26px}
.set-nav .sntxt{flex:1;min-width:0}
.set-nav .sntxt b{display:block;font-size:16.5px;font-weight:800;color:var(--ink);line-height:1.15}
.set-nav .sntxt span{font-size:12px;font-weight:600;color:#8a7a63;line-height:1.2}
.set-nav .arrow{color:#b3a488;flex:none}
.set-seclbl{font-size:11px;font-weight:800;letter-spacing:1.2px;color:#a08e6d;margin:12px 4px 2px;text-transform:uppercase}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;font-weight:800;font-size:16px;border-bottom:2px solid rgba(139,90,43,.14)}
.switch{width:56px;height:30px;border-radius:99px;background:#C9BB9C;border:2px solid var(--wood-d);position:relative;transition:background .2s;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--green)}
.switch.on i{left:28px}
/* ============ MODALS ============ */
#modalLayer{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(30,22,12,.55);backdrop-filter:blur(2px)}
#modalLayer.show{display:flex}
.modal{width:min(92vw,380px);max-height:86dvh;overflow-y:auto;background:var(--cream);border:3px solid var(--wood-d);
  border-radius:24px;padding:20px 18px;box-shadow:0 10px 0 rgba(74,47,23,.5),0 24px 40px rgba(0,0,0,.3);
  animation:modalIn .32s cubic-bezier(.3,1.4,.5,1);background-image:repeating-linear-gradient(98deg,rgba(139,90,43,.05) 0 3px,transparent 3px 26px)}
@keyframes modalIn{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h3{font-family:'Lilita One';font-size:25px;text-align:center;color:#2E4A22;margin-bottom:4px}
.modal .sub{text-align:center;font-weight:600;color:#8a7a63;font-size:14px;margin-bottom:14px}
.modal .btncol{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.win-stars{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}
.win-stars .ws{opacity:0;transform:scale(.2)}
.win-stars .ws.on{animation:starPop2 .5s cubic-bezier(.3,2,.5,1) forwards}
@keyframes starPop2{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.45)}100%{opacity:1;transform:scale(1)}}
.win-coins{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Lilita One';font-size:26px;color:#B8860B;margin:6px 0 4px}
.chap-badge{width:110px;margin:4px auto 8px;animation:badgeIn .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes badgeIn{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.unlock-panel{background:rgba(139,90,43,.1);border:2px dashed rgba(139,90,43,.45);border-radius:16px;padding:14px;margin-top:10px}
.unlock-row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding:4px 2px}
.unlock-row b{color:#B8860B;display:inline-flex;align-items:center;gap:5px}
/* ============ TUTORIAL ============ */
.tut-step{animation:tutIn .28s ease}
@keyframes tutIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.tut-art{
  width:100%;max-width:250px;margin:2px auto 8px;padding:12px;border-radius:18px;
  background:#fff;border:2.5px solid rgba(139,90,43,.35);
  display:flex;align-items:center;justify-content:center;min-height:96px;
}
.tut-art svg{width:100%;max-width:210px;height:auto}
.tut-txt{font-size:15.5px;font-weight:700;line-height:1.5;text-align:center;color:var(--ink);min-height:68px}
.tut-txt b{color:#B8860B}
.tut-stepnum{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;margin:0 auto 8px;
  background:var(--amber);border:2.5px solid var(--outline);color:#5E3A16;
  font-family:'Lilita One';font-size:14px;letter-spacing:1px;
  padding:4px 16px;border-radius:99px;box-shadow:0 3px 0 var(--amber-d);
  text-align:center;
}
.tut-dots{display:flex;justify-content:center;gap:7px;margin:12px 0 2px}
.tut-dots i{width:10px;height:10px;border-radius:50%;background:#C9BB9C;border:2px solid rgba(74,47,23,.4);transition:background .2s,transform .2s}
.tut-dots i.on{background:var(--green);transform:scale(1.25)}
.tut-nav{display:flex;gap:9px;margin-top:8px}
.tut-nav .btn{flex:1}
/* ============ TOAST / FX ============ */
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:60;
  background:rgba(58,42,30,.94);color:#FFE9C4;font-weight:800;font-size:14.5px;padding:10px 20px;border-radius:99px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fxLayer{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.scorepop{position:absolute;font-family:'Lilita One';color:#fff;font-size:19px;text-shadow:0 2px 0 rgba(74,47,23,.7),0 0 8px rgba(255,200,60,.5);
  animation:floatUp .9s ease-out forwards;pointer-events:none;z-index:15}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(.7)}30%{transform:translateY(-14px) scale(1.15)}to{opacity:0;transform:translateY(-44px) scale(1)}}
.shake{animation:shakex .4s}
@keyframes shakex{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (max-height:640px){
  #signSlot{width:min(78vw,320px)}
  .btn-play-big{min-height:64px;font-size:26px;width:min(80vw,290px)}
  #heroTushar{width:min(42vw,175px)}
  .hud{gap:5px}
  .tp-stars{height:15px}.tp-stars .ts svg{width:13px;height:13px}
  .tut-art{min-height:78px}.tut-txt{min-height:56px;font-size:14px}
}

const SAVE_KEY='jungleTusharSave_v2';
const DEFAULT_SAVE={
  v:2, coins:120, owned:[], completed:{}, chapters:{1:true}, highest:1, tutorial:true,
  equipped:{head:null,face:null,neck:null,back:null,skin:null,tail:null,theme:'classic',pieces:'classic',effects:{}},
  boosters:{moves:1,hammer:1,shuffle:1,rainbow:0},
  settings:{sound:true,vibrate:true}
};
function deepMerge(base,src){
  if(Array.isArray(base))return Array.isArray(src)?src:base;
  if(src===undefined||src===null)return base;
  if(typeof base!=='object'||base===null||typeof src!=='object')
    return (typeof src===typeof base)?src:base;
  const out={...base};
  for(const k in base)out[k]=deepMerge(base[k],src[k]);
  return out;
}
let save;
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    save=raw?deepMerge(structuredClone(DEFAULT_SAVE),JSON.parse(raw)):structuredClone(DEFAULT_SAVE);
  }catch(e){save=structuredClone(DEFAULT_SAVE)}
  if(!Number.isFinite(save.coins))save.coins=0;
  if(!Array.isArray(save.owned))save.owned=[];
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
loadSave();

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,dur=.12,type='sine',vol=.16,slide=0,delay=0){
  if(!save.settings.sound)return;
  try{
    const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}

  tap:()=>tone(500,.06,'triangle',.13), swap:()=>tone(320,.09,'sine',.13,120),
  bad:()=>tone(170,.14,'sawtooth',.07,-60), pop:m=>tone(400+Math.min(m,6)*85,.13,'triangle',.15,140),
  coin:()=>{tone(880,.08,'square',.09);tone(1320,.13,'square',.09,0,.07)},
  buy:()=>{tone(660,.09,'triangle',.13);tone(990,.15,'triangle',.13,0,.08)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.17,'triangle',.15,0,i*.11)),
  lose:()=>[392,330,262].forEach((f,i)=>tone(f,.2,'sine',.12,0,i*.15)),
  unlock:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.14,0,i*.09)),
  whoosh:()=>tone(520,.2,'sine',.08,-280)

/* ---------- toasts / modal / fx ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function showModal(html){const L=$('#modalLayer');L.innerHTML=`<div class="modal">${html}</div>`;L.classList.add('show');return L.firstElementChild}
function closeModal(){$('#modalLayer').classList.remove('show');$('#modalLayer').innerHTML=''}
 $('#modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal()});
function burstAt(x,y,colors,n=10,spread=70){
  const layer=$('#fxLayer');
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    const s=4+rnd(5);
    d.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:${Math.random()<.5?'50%':'2px'};background:${colors[rnd(colors.length)]};z-index:80`;
    layer.appendChild(d);
    const a=Math.random()*Math.PI*2,v=spread*(.4+Math.random()*.8);
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+30}px) rotate(${180+Math.random()*360}deg)`,opacity:0}],{duration:600+Math.random()*400,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>d.remove();
  }
}
function confettiRain(fireworks){
  const colors=['#F2A03D','#66BB6A','#F0617F','#4FA8D8','#F2C14E','#9A79D0'];
  const layer=$('#fxLayer'),n=fireworks?70:44;
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    const w=5+rnd(6);
    d.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-16px;width:${w}px;height:${w*1.5}px;background:${colors[rnd(colors.length)]};border-radius:2px;z-index:80`;
    layer.appendChild(d);
    d.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(105vh) rotate(${360+Math.random()*540}deg)`}],
      {duration:1600+Math.random()*1600,delay:Math.random()*(fireworks?800:300),easing:'cubic-bezier(.3,.4,.6,1)'}).onfinish=()=>d.remove();
  }
  if(fireworks){let k=0;const iv=setInterval(()=>{burstAt(innerWidth*(.2+Math.random()*.6),innerHeight*(.15+Math.random()*.4),colors,16,120);if(++k>=5)clearInterval(iv)},380)}
}

/* ---------- store UI ---------- */
let storeCat='outfit';
function buildStoreTabs(){
  $('#storeTabs').innerHTML=CATS.map(c=>
    `<button class="store-tab${c.id===storeCat?' on':''}" data-cat="${c.id}">${c.n}</button>`).join('');
  $$('#storeTabs .store-tab').forEach(b=>b.addEventListener('click',()=>{storeCat=b.dataset.cat;SFX.tap();buildStoreTabs();buildShop()}));
}
function itemState(it){
  if(it.req&&maxCompleted()<it.req&&!owns(it.id))return 'locked';
  if(owns(it.id))return 'owned';
  return 'buy';
}
function buildShop(){
  const grid=$('#shopGrid');
  const list=ITEMS.filter(i=>i.cat===storeCat);
  grid.innerHTML=list.map(it=>{
    const st=itemState(it);
    let action='';
    if(st==='locked')action=`<div class="lockrow">${IU.lock(16)} Reach Level ${it.req}</div>`;
    else if(it.cat==='booster'){
      const key=Object.keys(it.grant)[0];
      action=`<div style="display:flex;align-items:center;gap:8px"><span class="pricechip">${IU.coin}${it.price}</span><button class="btn amber small" data-buy="${it.id}">Buy</button></div><span class="ownedtag">${IU.check} Owned: ${save.boosters[key]||0}</span>`;
    }
    else if(it.cat==='effect'){
      const on=!!save.equipped.effects[it.id];
      action=`<div style="display:flex;align-items:center;gap:8px"><span class="pricechip">${IU.coin}${it.price}</span><button class="btn small ${owns(it.id)?'wood':'amber'}" data-buy="${it.id}">${owns(it.id)?(on?'Turn Off':'Turn On'):'Buy'}</button></div>${owns(it.id)?`<span class="ownedtag">${IU.check} Owned · ${on?'Active':'Off'}</span>`:''}`;
    }
    else if(st==='owned'){
      const eq=it.cat==='theme'?save.equipped.theme===it.id:it.cat==='pieces'?save.equipped.pieces===it.id:save.equipped[it.slot]===it.id;
      if(eq)action=`<span class="eqbadge">EQUIPPED</span><button class="btn wood small" data-eq="${it.id}">Unequip</button>`;
      else action=`<button class="btn small" data-eq="${it.id}">Equip</button>`;
    }
    else action=`<div style="display:flex;align-items:center;gap:8px"><span class="pricechip">${IU.coin}${it.price}</span><button class="btn amber small" data-buy="${it.id}">Buy</button></div>`;
    return `<div class="shop-card"><div class="ic">${ITEM_ICONS[it.icon]||''}</div><h5>${it.name}</h5><div class="ds">${it.desc}</div><div class="row">${action}</div></div>`;
  }).join('');
  grid.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buyItem(b.dataset.buy)));
  grid.querySelectorAll('[data-eq]').forEach(b=>b.addEventListener('click',()=>toggleEquip(b.dataset.eq)));
}
let buying=false;
function buyItem(id){
  if(buying)return;
  const it=ITEMS.find(i=>i.id===id);if(!it)return;
  if(it.cat==='effect'&&owns(id)){save.equipped.effects[id]=!save.equipped.effects[id];persist();applyTheme();refreshTushars();SFX.tap();buildShop();return}
  if(it.req&&maxCompleted()<it.req){toast(`Reach Level ${it.req} to unlock this!`);SFX.bad();return}
  buying=true;
  if(save.coins<it.price){toast('Not enough coins — play levels to earn more!');SFX.bad();$('#scr-store').classList.add('shake');setTimeout(()=>$('#scr-store').classList.remove('shake'),450);buying=false;return}
  if(!spendCoins(it.price)){buying=false;return}
  if(it.grant){for(const k in it.grant)save.boosters[k]=(save.boosters[k]||0)+it.grant[k]}
  else save.owned.push(id);
  persist();SFX.buy();buzz(20);
  const r=$('#scr-store .pill').getBoundingClientRect();
  burstAt(r.left+r.width/2,r.top+r.height/2,['#F2C14E','#FFE08A','#FFF3C2'],12,60);
  toast(`${it.name} ${it.grant?'added!':'purchased!'}`);
  buying=false;buildShop();refreshBoostBar();
}
function toggleEquip(id){
  const it=ITEMS.find(i=>i.id===id);if(!it||!owns(id))return;
  SFX.tap();
  if(it.cat==='theme')save.equipped.theme=save.equipped.theme===id?'classic':id;
  else if(it.cat==='pieces')save.equipped.pieces=save.equipped.pieces===id?'classic':id;
  else save.equipped[it.slot]=save.equipped[it.slot]===id?null:id;
  persist();applyTheme();refreshTushars();buildShop();
  if(G.active)restyleTiles();
}

/* ---------- navigation ---------- */
const SCREENS=['home','levels','game','store'];
function nav(name){
  SCREENS.forEach(s=>$('#scr-'+s).classList.toggle('active',s===name));
  document.body.classList.toggle('dim-scenery',name==='game');
  if(name==='levels')renderLevelSelect();
  if(name==='store'){buildStoreTabs();buildShop();refreshTushars()}
  if(name==='home')refreshTushars();
  if(name==='game')requestAnimationFrame(()=>{lastBW=0;lastBH=0;sizeBoard()});
}
 $$('[data-nav]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();nav(b.dataset.nav)}));

/* ---------- level select ---------- */
let curChap=1;
function chapProgress(ch){let n=0;for(let l=ch.start;l<=ch.end;l++)if(save.completed[l])n++;return n}
function renderLevelSelect(){
  if(!chapterUnlocked(curChap))curChap=1;
  $('#chapTabs').innerHTML=CHAPTERS.map(ch=>{
    const un=chapterUnlocked(ch.id);
    return `<button class="chap-tab${ch.id===curChap?' on':''}${un?'':' locked'}" data-ch="${ch.id}">
      ${un?`<b>Ch.${ch.id}</b> ${ch.name}`:`${IU.lock(15)} Ch.${ch.id} · ${ch.cost} coins`}</button>`;
  }).join('');
  $$('#chapTabs .chap-tab').forEach(b=>b.addEventListener('click',()=>{
    const id=+b.dataset.ch;
    if(!chapterUnlocked(id)){openChapterUnlock(id);return}
    curChap=id;SFX.tap();renderLevelSelect();
  }));
  const ch=CHAPTERS.find(c=>c.id===curChap);
  const done=chapProgress(ch),total=ch.end-ch.start+1;
  $('#lvlProgFill').style.width=(done/total*100)+'%';
  $('#lvlProgTxt').textContent=`Chapter ${ch.id} · ${done} / ${total} levels`;
  const next=save.highest;
  $('#continueBar').innerHTML=levelUnlocked(next)&&next>=ch.start&&next<=ch.end
    ?`<button class="btn amber block" id="btnContinue">Continue — Level ${next}</button>`:'';
  const cb=$('#btnContinue');if(cb)cb.addEventListener('click',()=>{SFX.tap();startLevel(next)});
  let html='';
  for(let l=ch.start;l<=ch.end;l++){
    const un=levelUnlocked(l),st=save.completed[l];
    if(st)html+=`<button class="lvl-cell done" data-lv="${l}">${l}<span class="st">${IU.star(12,st>=1)}${IU.star(12,st>=2)}${IU.star(12,st>=3)}</span></button>`;
    else if(l===save.highest&&un)html+=`<button class="lvl-cell cur" data-lv="${l}"><span class="lvtag">PLAY</span>${l}</button>`;
    else if(un)html+=`<button class="lvl-cell" data-lv="${l}">${l}</button>`;
    else html+=`<div class="lvl-cell locked">${IU.lock(18)}</div>`;
  }
  $('#lvlGrid').innerHTML=html;
  $$('#lvlGrid [data-lv]').forEach(b=>b.addEventListener('click',()=>{SFX.tap();startLevel(+b.dataset.lv)}));
  $$('#lvlGrid .locked').forEach(b=>b.addEventListener('click',()=>toast('Complete earlier levels to unlock!')));
}
function openChapterUnlock(id){
  const ch=CHAPTERS.find(c=>c.id===id);if(!ch)return;
  if(chapterUnlocked(id))return;
  if(ch.id>2&&!chapterUnlocked(id-1)){toast('Unlock the previous chapter first!');return}
  const m=showModal(`
    <h3>Unlock Chapter ${ch.id}</h3>
    <div class="sub">${ch.name} · Levels ${ch.start}–${ch.end}</div>
    <div class="unlock-panel">
      <div class="unlock-row"><span>Required coins</span><b>${IU.coin}${ch.cost.toLocaleString()}</b></div>
      <div class="unlock-row"><span>Your coins</span><b>${IU.coin}<span class="coin-val">${save.coins.toLocaleString()}</span></b></div>
    </div>
    <div class="btncol">
      <button class="btn amber block" id="btnUnlockCh">Unlock for ${ch.cost.toLocaleString()} coins</button>
      <button class="btn wood small block" id="btnCancelCh">Not now</button>
    </div>`);
  m.querySelector('#btnCancelCh').addEventListener('click',()=>{SFX.tap();closeModal()});
  const ub=m.querySelector('#btnUnlockCh');
  ub.addEventListener('click',()=>{
    if(ub.dataset.confirm){
      if(!spendCoins(ch.cost)){SFX.bad();toast('Not enough coins!');return}
      save.chapters[id]=true;persist();SFX.unlock();buzz(40);
      confettiRain(false);
      curChap=id;
      m.innerHTML=`<div style="text-align:center;padding:8px 0">
        <div class="chap-badge">${IU.trophy}</div>
        <h3>Chapter ${ch.id} Unlocked!</h3>
        <div class="sub">${ch.name} — Levels ${ch.start}–${ch.end} are now open.</div>
        <div class="btncol"><button class="btn block" id="btnGoCh2">Continue to Chapter ${ch.id}</button></div></div>`;
      burstAt(innerWidth/2,innerHeight/2-40,['#F2C14E','#FFE08A','#66BB6A','#4FA8D8'],24,130);
      m.querySelector('#btnGoCh2').addEventListener('click',()=>{SFX.tap();closeModal();renderLevelSelect()});
    }else{
      ub.dataset.confirm='1';ub.textContent='Tap again to spend '+ch.cost.toLocaleString()+' coins';
      setTimeout(()=>{if(ub.isConnected){delete ub.dataset.confirm;ub.textContent='Unlock for '+ch.cost.toLocaleString()+' coins'}},3000);
    }
  });
}

/* ---------- level params ---------- */
const levelMoves=lv=>Math.max(14,24-Math.floor(lv/8));
const levelTarget=lv=>Math.round((400+lv*50)*(1+lv*0.003));
const levelTypes=lv=>lv<10?4:lv<35?5:6;
const starThresholds=t=>[t,Math.round(t*1.4),Math.round(t*1.9)];

/* ---------- game engine ---------- */
const ROWS=7,COLS=7;
const G={active:false,lv:1,grid:[],moves:0,target:0,score:0,busy:true,types:5,tile:0,lastSwap:null,idleT:null,targetMode:null};
const boardEl=$('#board');
const boardFrameEl=document.getElementById('boardFrame');

function startLevel(lv){
  if(!levelUnlocked(lv)){toast('This level is still locked!');return}
  G.lv=lv;G.active=true;G.busy=true;G.score=0;
  G.moves=levelMoves(lv)+(owns('startmoves')?2:0);
  G.target=levelTarget(lv);G.types=levelTypes(lv);
  G.lastSwap=null;G.targetMode=null;
  nav('game');
  $('#hudLevel').textContent=lv;
  $('#tpTarget').textContent=G.target.toLocaleString();
  buildStarMarkers();
  buildGridDOM();
  renderBoostBar();
  updateHUD();
  boardMsg(`Level ${lv} — reach ${G.target.toLocaleString()} in ${G.moves} moves!`);
  setTimeout(()=>{G.busy=false;resetIdle()},500);
}
function boardMsg(t){const m=$('#boardMsg');m.textContent=t;m.classList.add('show');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('show'),1900)}
function buildStarMarkers(){
  const th=starThresholds(G.target),max=th[2];
  $('#tpStars').innerHTML=th.map(t=>`<span class="ts" style="left:${t/max*100}%">${IU.star(15,false)}</span>`).join('');
}

/* ============================================================
   BOARD SIZING — STABLE (fix for tiles jumping on mobile)
   • mobile URL-bar show/hide fires "resize" constantly; now the
     board only re-layouts if the computed tile size ACTUALLY changed
   • never re-layouts mid-animation (deferred until the turn ends)
============================================================ */
let lastTileSize=0,pendingResize=false;
function sizeBoard(force){
  const w=$('#boardWrap').clientWidth-20,h=$('#boardWrap').clientHeight-20;
  const s=Math.max(120,Math.min(w,h));
  const tile=Math.floor(s/COLS);
  /* FIX: if the tile size is unchanged (URL-bar jitter etc.), do NOTHING —
     this is what previously made all cards shift around mid-game */
  if(!force&&tile===lastTileSize)return;
  /* FIX: never resize while a cascade/animation is running */
  if(G.active&&G.busy&&!force&&boardEl.querySelector('.tile')){pendingResize=true;return}
  lastTileSize=tile;G.tile=tile;
  boardEl.style.width=tile*COLS+'px';boardEl.style.height=tile*ROWS+'px';
  if(G.active)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.grid[r]&&G.grid[r][c];if(t&&t.el){t.el.style.width=t.el.style.height=(G.tile-6)+'px';setXY(t.el,r,c)}}
}
function applyPendingResize(){if(pendingResize){pendingResize=false;sizeBoard()}}
let resizeT=null;
addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>sizeBoard(false),150)},{passive:true});
addEventListener('orientationchange',()=>setTimeout(()=>sizeBoard(true),300));

function setXY(el,r,c){el.style.setProperty('--tf',`translate(${c*G.tile+3}px,${r*G.tile+3}px)`);el.style.transform=`translate(${c*G.tile+3}px,${r*G.tile+3}px)`;el.dataset.r=r;el.dataset.c=c}
function newTileEl(t,r,c){
  const el=document.createElement('div');
  el.className='tile';
  el.style.width=el.style.height=(G.tile-6)+'px';
  el.innerHTML=(t.sp?BURST_RING:'')+pieceSVG(t.t);
  if(t.sp)el.classList.add('hasBurst');
  el.style.background=`var(${(r+c)%2?'--cellB':'--cellA'})`;
  setXY(el,r,c);
  el.addEventListener('pointerdown',onTileDown);
  boardEl.appendChild(el);t.el=el;
}
function buildGridDOM(){
  boardEl.querySelectorAll('.tile').forEach(e=>e.remove());
  G.grid=[];
  for(let r=0;r<ROWS;r++){
    G.grid[r]=[];
    for(let c=0;c<COLS;c++){
      let t;do{t=rnd(G.types)}
      while((c>=2&&G.grid[r][c-1].t===t&&G.grid[r][c-2].t===t)||(r>=2&&G.grid[r-2][c].t===t&&G.grid[r-1][c].t===t));
      G.grid[r][c]={t,sp:false,el:null};
    }
  }
  requestAnimationFrame(()=>{sizeBoard(true);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)newTileEl(G.grid[r][c],r,c)});
}
function restyleTiles(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.grid[r][c];
    if(t.el){t.el.innerHTML=(t.sp?BURST_RING:'')+pieceSVG(t.t);t.el.classList.toggle('hasBurst',t.sp);

function updateHUD(){

/* ============================================================
   INPUT — reliable swipe + tap-to-select (hardened)
   • no drag can START while the board is busy or coords are invalid
   • if the grabbed tile gets removed by a cascade, drag aborts
   • window-level move/up so the finger may leave the tile safely
   • dominant-axis check kills diagonal/ambiguous swipes
   • tap = select; tap adjacent = swap
============================================================ */
let drag=null,selTile=null;
const inGrid=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
function tileFromEl(el){const r=+el.dataset.r,c=+el.dataset.c;return{r,c}}
function clearSel(){if(selTile&&selTile.el)selTile.el.classList.remove('selected');selTile=null}
function onTileDown(e){
  if(!G.active)return;
  if(drag)return;                    /* already tracking a finger */
  if(G.busy)return;                  /* FIX: never start a drag mid-animation */
  const el=e.currentTarget;
  if(G.targetMode){applyTargetMode(el);return}
  const p=tileFromEl(el);
  if(!inGrid(p.r,p.c))return;        /* FIX: ignore stale/off-screen coords */
  drag={pid:e.pointerId,r:p.r,c:p.c,x:e.clientX,y:e.clientY,el};
}
function onDragMove(e){
  if(!drag||e.pointerId!==drag.pid)return;
  /* FIX: if the grabbed tile was destroyed by a cascade, abort cleanly */
  if(!drag.el||!drag.el.isConnected){drag=null;return}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  const TH=Math.max(20,G.tile*0.32);
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(Math.max(adx,ady)<TH)return;
  let r2=drag.r,c2=drag.c;
  if(adx>ady*1.2)c2+=dx>0?1:-1;
  else if(ady>adx*1.2)r2+=dy>0?1:-1;
  else return; /* ambiguous diagonal — wait for a clearer swipe */
  const r1=drag.r,c1=drag.c;
  drag=null; /* one swipe = one swap */
  clearSel();
  if(!inGrid(r2,c2))return;
  trySwap(r1,c1,r2,c2);
}
function onDragUp(e){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  if(G.busy)return;                          /* board was animating — ignore */
  if(!inGrid(d.r,d.c))return;                /* stale coords — ignore */
  if(!d.el||!d.el.isConnected)return;        /* tile already removed — ignore */
  /* ---- TAP: select / swap-tap mode ---- */
  if(selTile){
    if(selTile.r===d.r&&selTile.c===d.c){clearSel();SFX.tap();return}
    if(Math.abs(selTile.r-d.r)+Math.abs(selTile.c-d.c)===1){
      const s=selTile;clearSel();
      trySwap(s.r,s.c,d.r,d.c);
      return;
    }
    clearSel();
  }
  selTile={r:d.r,c:d.c,el:d.el};
  d.el.classList.add('selected');
  SFX.tap();
}
function onDragCancel(e){
  if(drag&&e.pointerId===drag.pid)drag=null;
}
addEventListener('pointermove',onDragMove,{passive:true});
addEventListener('pointerup',onDragUp);
addEventListener('pointercancel',onDragCancel);

function trySwap(r1,c1,r2,c2){
  if(G.busy)return;
  if(r1===r2&&c1===c2)return;
  const a=G.grid[r1][c1],b=G.grid[r2][c2];
  if(!a||!b||!a.el||!b.el)return;
  G.busy=true;resetIdle();
  SFX.swap();buzz(8);
  setXY(a.el,r2,c2);setXY(b.el,r1,c1);
  /* FIX: wait 270ms — slightly LONGER than the 240ms transition — so the
     grid and the visuals can never be out of sync (that mismatch was one
     cause of pieces appearing to snap to wrong places) */
  setTimeout(async()=>{
    G.grid[r1][c1]=b;G.grid[r2][c2]=a;
    G.lastSwap=[{r:r2,c:c2},{r:r1,c:c1}];
    const m=findMatches();
    if(!m.cells.size){
      G.grid[r1][c1]=a;G.grid[r2][c2]=b;G.lastSwap=null;
      SFX.bad();setXY(a.el,r1,c1);setXY(b.el,r2,c2);
      boardFrameEl.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});
      setTimeout(()=>{G.busy=false;resetIdle();applyPendingResize()},300);
      return;
    }
    G.moves--;updateHUD();
    await resolveBoard();
    afterTurn();
  },270);
}
const key=(r,c)=>r*COLS+c;
function findMatches(){
  const cells=new Set(),runs=[];
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){const t=G.grid[r][c];
    if(!t){c++;continue}
    let e=c;while(e+1<COLS&&G.grid[r][e+1]&&G.grid[r][e+1].t===t.t)e++;
    if(e-c>=2){for(let i=c;i<=e;i++)cells.add(key(r,i));runs.push({h:true,r,c1:c,c2:e,len:e-c+1})}
    c=e+1}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){const t=G.grid[r][c];
    if(!t){r++;continue}
    let e=r;while(e+1<ROWS&&G.grid[e+1][c]&&G.grid[e+1][c].t===t.t)e++;
    if(e-r>=2){for(let i=r;i<=e;i++)cells.add(key(i,c));runs.push({h:false,c,r1:r,r2:e,len:e-r+1})}
    r=e+1}}
  const q=[...cells].map(k=>({r:Math.floor(k/COLS),c:k%COLS})).filter(p=>G.grid[p.r][p.c]&&G.grid[p.r][p.c].sp);
  const seen=new Set(q.map(p=>key(p.r,p.c)));
  while(q.length){
    const p=q.shift();
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const r=p.r+dr,c=p.c+dc;
      if(r<0||r>=ROWS||c<0||c>=COLS||!G.grid[r][c])continue;
      const k=key(r,c);
      if(!cells.has(k)){cells.add(k);if(G.grid[r][c].sp&&!seen.has(k)){seen.add(k);q.push({r,c})}}
    }
  }
  return{cells,runs};
}
async function resolveBoard(){
  let mult=1,guard=0;
  while(guard++<60){
    const m=findMatches();
    if(!m.cells.size)break;
    const spawns=new Map();
    if(mult===1&&G.lastSwap){
      for(const run of m.runs){
        if(run.len<4)continue;
        let sc=null;
        for(const sw of G.lastSwap){
          const r=sw.r,c=sw.c;
          const inRun=run.h?(r===run.r&&c>=run.c1&&c<=run.c2):(c===run.c&&r>=run.r1&&r<=run.r2);
          if(inRun&&G.grid[r][c]){sc={r,c};break}
        }
        if(!sc){const mid=run.h?{r:run.r,c:Math.floor((run.c1+run.c2)/2)}:{r:Math.floor((run.r1+run.r2)/2),c:run.c};
          if(G.grid[mid.r][mid.c])sc=mid}
        if(sc&&!spawns.has(key(sc.r,sc.c)))spawns.set(key(sc.r,sc.c),sc);
      }
    }
    await clearCells(m.cells,spawns,mult);
    await dropFill();
    mult=Math.min(mult+1,5);
  }
  G.lastSwap=null;
}
async function clearCells(cells,spawns,mult){
  SFX.pop(mult);buzz(12);
  const pts=[...cells].reduce((s,k)=>{const t=G.grid[Math.floor(k/COLS)][k%COLS];return s+(t&&t.sp?25:15)},0)*mult;
  let sx=0,sy=0,n=0;
  const sk=PIECE_SKINS[save.equipped.pieces]||PIECE_SKINS.classic;
  const fx=save.equipped.effects;
  cells.forEach(k=>{
    const r=Math.floor(k/COLS),c=k%COLS,t=G.grid[r][c];if(!t)return;
    sx+=c;sy+=r;n++;
    t.el.classList.add('pop');
    if(fx.sparkles||fx.starpop){
      const cols=fx.starpop?['#FFD23D','#FFFFFF','#FFE08A','#F2A03D']:[sk.c[t.t][0],'#FFF3C2'];
      const b=t.el.getBoundingClientRect();
      burstAt(b.left+b.width/2,b.top+b.height/2,cols,5,44);
    }
  });
  if(pts>0){
    G.score+=pts;updateHUD();
    const px=boardEl.getBoundingClientRect();
    const pop=document.createElement('div');pop.className='scorepop';pop.textContent='+'+pts.toLocaleString();
    pop.style.left=(px.left+(sx/n+.5)*G.tile-14)+'px';pop.style.top=(px.top+(sy/n)*G.tile)+'px';
    pop.style.position='fixed';document.body.appendChild(pop);setTimeout(()=>pop.remove(),900);
  }
  spawns.forEach((s,k)=>{cells.delete(k);
    const t=G.grid[s.r][s.c];
    if(t&&!t.sp){t.sp=true;t.el.innerHTML=BURST_RING+pieceSVG(t.t);t.el.classList.add('hasBurst')}});
  await wait(250);
  cells.forEach(k=>{const r=Math.floor(k/COLS),c=k%COLS,t=G.grid[r][c];
    if(t&&t.el)t.el.remove();G.grid[r][c]=null});
}
async function dropFill(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(G.grid[r][c]){
        if(write!==r){G.grid[write][c]=G.grid[r][c];G.grid[r][c]=null;
          setXY(G.grid[write][c].el,write,c)}
        write--;
      }
    }
    for(let r=write;r>=0;r--){
      const t={t:rnd(G.types),sp:false,el:null};
      G.grid[r][c]=t;
      newTileEl(t,r-(write+1),c);
      const el=t.el;el.style.transition='none';setXY(el,r-(write+1),c);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.style.transition='';setXY(el,r,c);
      }));
    }
  }
  await wait(320);
}
function afterTurn(){
  applyPendingResize(); /* FIX: any deferred board resize happens here, safely */
  if(G.score>=G.target||G.moves<=0){finishLevel();return}
  if(!hasAnyMove()){boardMsg('No moves — reshuffling!');shuffleBoard(true)}
  G.busy=false;resetIdle();
}
function matchAt(r,c){
  const t=G.grid[r][c];if(!t)return false;
  let n=1;for(let i=c-1;i>=0&&G.grid[r][i]&&G.grid[r][i].t===t.t;i--)n++;
  for(let i=c+1;i<COLS&&G.grid[r][i]&&G.grid[r][i].t===t.t;i++)n++;
  if(n>=3)return true;
  n=1;for(let i=r-1;i>=0&&G.grid[i][c]&&G.grid[i][c].t===t.t;i++)n++;
  for(let i=r+1;i<ROWS&&G.grid[i][c]&&G.grid[i][c].t===t.t;i++)n++;
  return n>=3;
}
function hasAnyMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+1<COLS){swapT(r,c,r,c+1);const ok=matchAt(r,c)||matchAt(r,c+1);swapT(r,c,r,c+1);if(ok)return true}
    if(r+1<ROWS){swapT(r,c,r+1,c);const ok=matchAt(r,c)||matchAt(r+1,c);swapT(r,c,r+1,c);if(ok)return true}
  }
  return false;
}
function swapT(r1,c1,r2,c2){const t=G.grid[r1][c1];G.grid[r1][c1]=G.grid[r2][c2];G.grid[r2][c2]=t}
async function shuffleBoard(auto){
  for(let tries=0;tries<30;tries++){
    const all=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)all.push(G.grid[r][c].t);
    for(let i=all.length-1;i>0;i--){const j=rnd(i+1);[all[i],all[j]]=[all[j],all[i]]}
    for(let i=all.length-1;i>0;i--){const j=rnd(i+1);[all[i],all[j]]=[all[j],all[i]]}
    let i=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)G.grid[r][c].t=all[i++];
    if(!findMatches().cells.size&&hasAnyMove())break;
  }
  SFX.whoosh();
  boardEl.animate([{opacity:1},{opacity:.25},{opacity:1}],{duration:420});
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.grid[r][c];t.el.innerHTML=(t.sp?BURST_RING:'')+pieceSVG(t.t)}
  await wait(420);
  if(findMatches().cells.size)await resolveBoard();
}
/* idle hint */
function resetIdle(){clearTimeout(G.idleT);G.idleT=setTimeout(showHint,6000)}
function showHint(){
  if(!G.active||G.busy)return;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const[dr,dc]of[[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;
      swapT(r,c,r2,c2);const ok=matchAt(r,c)||matchAt(r2,c2);swapT(r,c,r2,c2);
      if(ok){G.grid[r][c].el.classList.add('hintp');G.grid[r2][c2].el.classList.add('hintp');
        setTimeout(()=>{G.grid[r]&&G.grid[r][c]&&G.grid[r][c].el&&G.grid[r][c].el.classList.remove('hintp');
          G.grid[r2]&&G.grid[r2][c2]&&G.grid[r2][c2].el&&G.grid[r2][c2].el.classList.remove('hintp')},2100);
        return}
    }
  }
}
/* ---------- boosters ---------- */
const BOOSTS=[
  {k:'hammer',n:'Hammer',ic:'hammer'},{k:'shuffle',n:'Shuffle',ic:'shuffle'},
  {k:'rainbow',n:'Rainbow',ic:'rainbow'},{k:'moves',n:'+ Moves',ic:'plus'}
];
function renderBoostBar(){
  $('#boosterBar').innerHTML=BOOSTS.map(b=>
    `<button class="boostbtn${(save.boosters[b.k]||0)<1?' empty':''}" data-boost="${b.k}" aria-label="${b.n}">${b.ic==='plus'?IU.plus:IU[b.ic]}<span class="bl">${b.n}</span>${(save.boosters[b.k]||0)>0?`<span class="cnt">${save.boosters[b.k]}</span>`:''}</button>`).join('');
  $$('#boosterBar [data-boost]').forEach(b=>b.addEventListener('click',()=>useBooster(b.dataset.boost)));
}
function refreshBoostBar(){if(G.active)renderBoostBar()}
async function useBooster(k){
  if(!G.active)return;
  if((save.boosters[k]||0)<1){toast('None left — get more in the Store!');SFX.bad();return}
  if(G.targetMode){cancelTargetMode()}
  if(k==='moves'){
    if(G.busy)return;
    save.boosters.moves--;persist();G.moves+=5;updateHUD();renderBoostBar();
    SFX.buy();boardMsg('+5 moves!');return;
  }
  if(k==='shuffle'){
    if(G.busy)return;
    save.boosters.shuffle--;persist();renderBoostBar();
    G.busy=true;
    await shuffleBoard(false);
    G.busy=false;resetIdle();afterTurn();
    return;
  }
  G.targetMode=k;boardEl.classList.add('targeting');
  boardMsg(k==='hammer'?'Tap a piece to smash!':'Tap a piece to clear its color!');
  renderBoostBar(k);
}
async function applyTargetMode(el){
  const p=tileFromEl(el),t=G.grid[p.r]&&G.grid[p.r][p.c];if(!t)return;
  const kind=G.targetMode;
  G.targetMode=null;boardEl.classList.remove('targeting');renderBoostBar();
  save.boosters[kind]--;persist();
  G.busy=true;
  const cells=new Set([key(p.r,p.c)]);
  if(kind==='rainbow'){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c]&&G.grid[r][c].t===t.t)cells.add(key(r,c))}
  SFX.whoosh();
  await clearCells(cells,new Map(),1);
  await dropFill();await resolveBoard();
  afterTurn();
}
function cancelTargetMode(){G.targetMode=null;boardEl.classList.remove('targeting');renderBoostBar()}
/* ---------- level end ---------- */
function finishLevel(){
  G.busy=true;clearTimeout(G.idleT);
  setTimeout(()=>G.score>=G.target?onWin():onLose(),500);
}
function onWin(){
  SFX.win();buzz([30,40,30]);
  const lv=G.lv,th=starThresholds(G.target);
  const stars=1+(G.score>=th[1]?1:0)+(G.score>=th[2]?1:0);
  const first=!(lv in save.completed);
  let coins=first?25+stars*15+Math.round(G.moves*1.5):Math.round((25+stars*15+G.moves*1.5)*.4);
  if(owns('charm'))coins=Math.round(coins*1.15);
  if(owns('doublecoins'))coins*=2;
  const wasChEnd=lv===chapterOf(lv).end;
  save.completed[lv]=Math.max(save.completed[lv]||0,stars);
  save.highest=Math.max(save.highest,lv+1);
  persist();
  if(save.equipped.effects.confetti||save.equipped.effects.fireworks)confettiRain(save.equipped.effects.fireworks);
  const m=showModal(`
    <h3>Level ${lv} Complete!</h3>
    <div class="win-stars">${[1,2,3].map(i=>`<span class="ws${i<=stars?' on':''}" style="animation-delay:${i*.22}s">${IU.star(46,i<=stars)}</span>`).join('')}</div>
    <div class="sub">Score ${G.score.toLocaleString()} / ${G.target.toLocaleString()}</div>
    <div class="win-coins">${IU.coin.replace('<svg viewBox','<svg width="30" height="30" viewBox')} +<span id="coinCnt">0</span></div>
    ${first?'':'<div class="sub" style="font-size:12px">Replay bonus · 40% coins</div>'}
    <div class="btncol">
      <button class="btn block" id="btnNext">${wasChEnd?'Continue':'Next Level'}</button>
      <div style="display:flex;gap:9px"><button class="btn wood small" style="flex:1" id="btnReplay">Replay</button><button class="btn wood small" style="flex:1" id="btnHome2">Level Map</button></div>
    </div>`);
  let shown=0;const step=Math.max(1,Math.round(coins/28));
  const iv=setInterval(()=>{shown=Math.min(shown+step,coins);m.querySelector('#coinCnt').textContent=shown;
    if(shown>=coins){clearInterval(iv);SFX.coin()}},34);
  addCoins(coins);
  burstAt(innerWidth/2,innerHeight/2,['#F2C14E','#FFE08A'],14,90);
  m.querySelector('#btnNext').addEventListener('click',()=>{SFX.tap();closeModal();G.active=false;
    if(wasChEnd){const nc=chapterOf(lv).id+1;
      if(nc<=CHAPTERS.length&&!chapterUnlocked(nc))openChapterUnlock(nc);
      else if(nc<=CHAPTERS.length){curChap=nc;nav('levels')}
      else{toast('More jungle chapters coming soon!');nav('levels')}}
    else startLevel(lv+1)});
  m.querySelector('#btnReplay').addEventListener('click',()=>{SFX.tap();closeModal();startLevel(lv)});
  m.querySelector('#btnHome2').addEventListener('click',()=>{SFX.tap();closeModal();G.active=false;nav('levels')});
}
function onLose(){
  SFX.lose();
  const lv=G.lv;
  const m=showModal(`
    <h3>Out of Moves!</h3>
    <div class="sub">You scored ${G.score.toLocaleString()} of ${G.target.toLocaleString()} — so close!</div>
    <div class="btncol">
      ${(save.boosters.moves||0)>0?`<button class="btn amber block" id="btnExtra">${IU.plus} Use +5 Moves (${save.boosters.moves} left)</button>`:''}
      <button class="btn block" id="btnRetry">Retry Level</button>
      <button class="btn wood small block" id="btnHome3">Level Map</button>
    </div>`);
  const ex=m.querySelector('#btnExtra');
  if(ex)ex.addEventListener('click',()=>{SFX.buy();save.boosters.moves--;persist();closeModal();
    G.moves+=5;updateHUD();renderBoostBar();G.busy=false;resetIdle();boardMsg('+5 moves — good luck!')});
  m.querySelector('#btnRetry').addEventListener('click',()=>{SFX.tap();closeModal();startLevel(lv)});
  m.querySelector('#btnHome3').addEventListener('click',()=>{SFX.tap();closeModal();G.active=false;nav('levels')});
}

let tutStep=0;
function showTutorial(start=0){
  tutStep=clamp(start,0,TUT_STEPS.length-1);
  renderTutorial();
}
function renderTutorial(){
  const s=TUT_STEPS[tutStep],last=tutStep===TUT_STEPS.length-1;
  const m=showModal(`
    <div class="tut-step">
      <div style="text-align:center"><span class="tut-stepnum">STEP ${tutStep===0?'·':tutStep} OF ${TUT_STEPS.length-1}</span></div>
      <h3 style="margin-bottom:8px">${s.title}</h3>
      <div class="tut-art">${s.art}</div>
      <div class="tut-txt">${s.txt}</div>
      <div class="tut-dots">${TUT_STEPS.map((_,i)=>`<i class="${i<=tutStep?'on':''}"></i>`).join('')}</div>
      <div class="tut-nav">
        ${tutStep>0?`<button class="btn wood" id="tutPrev">Back</button>`:''}
        <button class="btn ${last?'':'amber'}" id="tutNext">${last?"Let's Play! 🎉":'Next'}</button>
      </div>
      ${!last?`<button class="btn small block" style="margin-top:8px;background:#C9BB9C;color:#5E3A16;box-shadow:0 4px 0 #a08e6d" id="tutSkip">Skip</button>`:''}
    </div>`);
  const prev=m.querySelector('#tutPrev'),next=m.querySelector('#tutNext'),skip=m.querySelector('#tutSkip');
  if(prev)prev.addEventListener('click',()=>{SFX.tap();tutStep--;renderTutorial()});
  next.addEventListener('click',()=>{SFX.tap();
    if(last)endTutorial();else{tutStep++;renderTutorial()}});
  if(skip)skip.addEventListener('click',()=>{SFX.tap();endTutorial()});
}
function endTutorial(){
  save.tutorial=false;persist();
  closeModal();refreshTushars();
  confettiRain(false);
  toast("You're ready! Have fun! 🌟");
}

/* ---------- SETTINGS MENU ---------- */
 $('#btnSettings').addEventListener('click',()=>{
  SFX.tap();
  const m=showModal(`
    <div class="set-hero">
      <div class="tushar-slot"></div>
      <h3>Hi, I'm Tushar!</h3>
      <div class="sub" style="margin-bottom:4px">What would you like to do?</div>
    </div>
    <div class="set-navcol">
      <button class="set-nav" id="setStore">
        <span class="snic" style="background:#FFF0C9">${IU.shopcart}</span>
        <span class="sntxt"><b>Jungle Store</b><span>Buy outfits, themes &amp; boosters</span></span>
        <span class="arrow">${IU.arrow}</span>
      </button>
      <button class="set-nav" id="setHow">
        <span class="snic" style="background:#E2F3DC">${IU.book}</span>
        <span class="sntxt"><b>How to Play</b><span>See the step-by-step tutorial again</span></span>
        <span class="arrow">${IU.arrow}</span>
      </button>
    </div>
    <div class="set-seclbl">Options</div>
    <div class="setrow"><span>Sound</span><button class="switch${save.settings.sound?' on':''}" id="swSound"><i></i></button></div>
    <div class="setrow"><span>Vibration</span><button class="switch${save.settings.vibrate?' on':''}" id="swVib"><i></i></button></div>
    <div class="setrow" style="border:none"><span>Reset progress</span><button class="btn red small" id="btnReset">Reset</button></div>
    <div class="btncol"><button class="btn wood block" id="btnCloseSet">Close</button></div>`);
  refreshTushars();
  m.querySelector('#setStore').addEventListener('click',()=>{SFX.tap();closeModal();nav('store')});
  m.querySelector('#setHow').addEventListener('click',()=>{SFX.tap();closeModal();showTutorial(0)});
  m.querySelector('#swSound').addEventListener('click',e=>{save.settings.sound=!save.settings.sound;persist();e.currentTarget.classList.toggle('on',save.settings.sound);SFX.tap()});
  m.querySelector('#swVib').addEventListener('click',e=>{save.settings.vibrate=!save.settings.vibrate;persist();e.currentTarget.classList.toggle('on',save.settings.vibrate);buzz(20)});
  m.querySelector('#btnCloseSet').addEventListener('click',()=>{SFX.tap();closeModal()});
  m.querySelector('#btnReset').addEventListener('click',()=>{
    const m2=showModal(`
      <h3>Erase Everything?</h3>
      <div class="sub">Coins, items, outfits and level progress will be permanently deleted. This cannot be undone.</div>
      <div class="btncol">
        <button class="btn red block" id="btnResetYes">Yes, erase my progress</button>
        <button class="btn wood block" id="btnResetNo">Keep my progress</button>
      </div>`);
    m2.querySelector('#btnResetNo').addEventListener('click',()=>{SFX.tap();closeModal()});
    m2.querySelector('#btnResetYes').addEventListener('click',()=>{
      save=structuredClone(DEFAULT_SAVE);persist();
      applyTheme();refreshCoins();refreshTushars();closeModal();
      nav('home');toast('Progress reset. Welcome back to the jungle!');
    });
  });
});
 $('#btnPlay').addEventListener('click',()=>{SFX.tap();nav('levels')});

/* ---------- boot ---------- */
function boot(){
  $('#btnSettings').innerHTML=IU.gear;
  $('#btnPause').innerHTML=IU.pause;
  $$('[data-nav]').forEach(b=>b.innerHTML=IU.back);
  refreshCoins();applyTheme();refreshTushars();
  $('#signSlot').innerHTML=signSVG();
  document.addEventListener('pointerdown',()=>{if(save.settings.sound)try{ac()}catch(e){}},{once:true});
  if(save.tutorial)setTimeout(()=>showTutorial(0),450);
}
boot();

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Coin Rush Jungle</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      /* Wood palette */
      --wood-light: #c08b57;
      --wood-mid: #a06a3a;
      --wood-deep: #8a5a2e;
      --wood-outline: #5b3a1e;

      /* Jungle palette */
      --leaf: #54b463;
      --leaf-deep: #2e6b3a;
      --leaf-dark: #3f8f3f;

      --cream: #fff6df;
      --parchment: #fdf3d8;
      --gold: #ffcf4d;
      --ink: #4a2f16;
    }

    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #7bc463;
      font-family: 'Fredoka', sans-serif;
      color: var(--ink);
      touch-action: manipulation;
      position: fixed;
      inset: 0;
    }

    /* ============ JUNGLE BACKDROP (menus) ============ */
    .jungle-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(130% 100% at 50% 0%, #d6efae 0%, #a8dc86 48%, #7fc968 100%);
    }

    /* ============ WOOD MATERIALS ============ */
    .wood-chip {
      background:
        repeating-linear-gradient(92deg, rgba(80,45,15,.10) 0 3px, transparent 3px 16px),
        linear-gradient(180deg, var(--wood-light), var(--wood-mid));
      border: 3px solid var(--wood-outline);
      box-shadow:
        inset 0 2px 0 rgba(255,240,210,.40),
        inset 0 -3px 0 rgba(70,40,15,.28),
        0 4px 0 rgba(70,40,15,.32);
    }

    .wood-planks {
      background:
        repeating-linear-gradient(180deg, rgba(70,40,15,.22) 0 2px, transparent 2px 34px),
        repeating-linear-gradient(91deg, rgba(80,45,15,.08) 0 3px, transparent 3px 21px),
        repeating-linear-gradient(89deg, rgba(255,240,210,.06) 0 2px, transparent 2px 30px),
        linear-gradient(180deg, var(--wood-light), var(--wood-mid));
      border: 4px solid var(--wood-outline);
      box-shadow:
        inset 0 3px 0 rgba(255,240,210,.35),
        inset 0 -4px 0 rgba(70,40,15,.30),
        0 8px 0 rgba(70,40,15,.32);
    }

    .nail {
      position: absolute;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #f4e0b0, #9a7040 65%, #6e4a24);
      border: 2px solid #4a2f16;
      box-shadow: 0 1px 0 rgba(255,255,255,.30);
      z-index: 2;
    }

    .rope {
      position: absolute;
      top: 0;
      width: 6px;
      height: calc(var(--rope-h, 48px) + 16px);
      background: repeating-linear-gradient(180deg, #b08149 0 8px, #8a5a2e 8px 16px);
      border-radius: 3px;
      z-index: 0;
    }

    /* ============ SCREENS ============ */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      z-index: 10;
      visibility: hidden; opacity: 0;
      transition: opacity .3s ease;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .screen.active { visibility: visible; opacity: 1; }

    /* ============ HOME : HEADER ============ */
    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(12px, 2.2vh, 18px) clamp(14px, 4vw, 24px);
      z-index: 6;
    }

    .wallet-box {
      display: flex; align-items: center;
      gap: clamp(8px, 2.4vw, 12px);
      padding: clamp(6px, 1.4vh, 9px) clamp(16px, 4.5vw, 22px) clamp(6px, 1.4vh, 9px) clamp(9px, 2.5vw, 12px);
      border-radius: 100px;
    }

    .coin-icon-svg {
      width: clamp(28px, 8vw, 36px);
      height: clamp(28px, 8vw, 36px);
      animation: coinSpin 3.2s infinite cubic-bezier(.4,0,.2,1);
    }
    @keyframes coinSpin {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    .wallet-amount {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(17px, 5vw, 23px);
      color: var(--cream);
      text-shadow: 0 2px 0 rgba(70,40,15,.45);
      min-width: clamp(52px, 16vw, 80px);
      letter-spacing: 1px;
    }

    .icon-btn {
      width: clamp(44px, 12vw, 52px);
      height: clamp(44px, 12vw, 52px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--cream);
      transition: transform .1s, box-shadow .1s;
      flex-shrink: 0;
    }
    .icon-btn:active {
      transform: translateY(3px) scale(.94);
      box-shadow: inset 0 2px 0 rgba(255,240,210,.40), inset 0 -2px 0 rgba(70,40,15,.28), 0 1px 0 rgba(70,40,15,.32);
    }
    .icon-btn svg { width: 52%; height: 52%; }

    /* ============ HOME : VINES & DECOR ============ */
    .home-vines {
      position: absolute; top: 0; left: 0; right: 0;
      height: clamp(90px, 18vh, 150px);
      pointer-events: none;
      z-index: 1;
    }
    .vine {
      position: absolute; top: -4px;
      transform-origin: top center;
      animation: vineSway 5.5s ease-in-out infinite alternate;
    }
    .vine.v1 { left: 5%;  height: 100%; }
    .vine.v2 { left: 47%; height: 62%;  animation-delay: -1.8s; }
    .vine.v3 { right: 6%; height: 85%;  animation-delay: -3.4s; }
    @keyframes vineSway {
      from { transform: rotate(3.5deg); }
      to   { transform: rotate(-3.5deg); }
    }

    .corner-leaf {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    .corner-leaf.cl-bl { left: -14px; bottom: -12px; width: clamp(110px, 30vw, 175px); }
    .corner-leaf.cl-br { right: -14px; bottom: -12px; width: clamp(95px, 26vw, 150px); transform: scaleX(-1); }

    .home-bushes {
      position: absolute; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 1;
    }
    .home-bushes .bush-back  { position: absolute; bottom: 0; left: 0; width: 100%; height: clamp(70px, 16vh, 130px); }
    .home-bushes .bush-front { position: absolute; bottom: -2px; left: 0; width: 100%; height: clamp(46px, 10vh, 90px); }

    /* ============ HOME : BODY ============ */
    .home-body {
      flex: 1;
      min-height: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(10px, 2.4vh, 22px);
      padding: 0 clamp(16px, 5vw, 28px) clamp(46px, 11vh, 100px);
      z-index: 4;
    }

    /* Hanging title sign */
    --rope-h: clamp(34px, 6.5vh, 60px);
    .sign-wrap {
      --rope-h: clamp(34px, 6.5vh, 60px);
      position: relative;
      padding-top: var(--rope-h);
      margin-bottom: clamp(2px, 1vh, 8px);
      animation: swing 5.5s ease-in-out infinite;
      transform-origin: 50% 0;
    }
    @keyframes swing {
      0%, 100% { transform: rotate(1.6deg); }
      50%      { transform: rotate(-1.6deg); }
    }
    .rope.rope-l { left: 17%; transform: rotate(3deg); transform-origin: top; }
    .rope.rope-r { right: 17%; transform: rotate(-3deg); transform-origin: top; }

    .sign {
      position: relative;
      border-radius: 20px;
      padding: clamp(12px, 2.6vh, 20px) clamp(20px, 6vw, 38px);
      text-align: center;
    }

    .game-title {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(30px, 9.5vw, 54px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 1px;
      color: var(--cream);
      white-space: nowrap;
      text-shadow:
        -0.045em -0.045em 0 var(--wood-outline),  0.045em -0.045em 0 var(--wood-outline),
        -0.045em  0.045em 0 var(--wood-outline),  0.045em  0.045em 0 var(--wood-outline),
        0 -0.07em 0 var(--wood-outline), 0 0.07em 0 var(--wood-outline),
        -0.07em 0 0 var(--wood-outline), 0.07em 0 0 var(--wood-outline),
        0 0.09em 0 rgba(70,40,15,.30);
    }
    .game-title span { color: var(--gold); }

    /* Game icon (vector — stays sharp at any density) */
    .app-icon {
      width: clamp(92px, 25vw, 130px);
      aspect-ratio: 1;
      border-radius: 27%;
      background: #8fce6e;
      border: clamp(4px, 1.2vw, 6px) solid var(--wood-outline);
      box-shadow: 0 8px 0 rgba(70,40,15,.28), inset 0 -6px 0 rgba(0,0,0,.10);
      display: grid; place-items: center;
      animation: floatIcon 3.6s ease-in-out infinite;
    }
    .app-icon svg { width: 88%; height: 88%; display: block; }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }

    .game-subtitle {
      background: var(--parchment);
      border: 3px solid var(--wood-outline);
      border-radius: 999px;
      padding: clamp(6px, 1.4vh, 10px) clamp(18px, 5vw, 28px);
      font-weight: 600;
      font-size: clamp(13px, 3.8vw, 16px);
      color: var(--ink);
      box-shadow: 0 4px 0 rgba(70,40,15,.26);
      transform: rotate(-1.2deg);
    }

    .btn-play {
      display: inline-flex; align-items: center; gap: 12px;
      background: var(--leaf);
      color: var(--cream);
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(20px, 6vw, 27px);
      letter-spacing: 2px;
      padding: clamp(12px, 2.2vh, 17px) clamp(34px, 9vw, 54px) clamp(10px, 2vh, 14px);
      border: 4px solid var(--wood-outline);
      border-radius: 20px;
      box-shadow: 0 7px 0 var(--wood-outline), inset 0 4px 0 rgba(255,255,255,.30);
      text-shadow: 0 2px 0 rgba(46,107,58,.60);
      cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }
    .btn-play svg { width: .85em; height: .85em; }
    .btn-play:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 var(--wood-outline), inset 0 4px 0 rgba(255,255,255,.30);
    }

    /* ============ GAME SCREEN ============ */
    .game-area { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .progress-track {
      position: absolute; top: 0; left: 0; right: 0;
      height: 8px;
      background: rgba(60,35,15,.32);
      z-index: 5;
    }
    .progress-bar {
      height: 100%; width: 100%;
      background: var(--leaf);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.35);
      transform-origin: left;
      transition: transform .2s linear;
    }

    .game-hud {
      position: absolute;
      top: calc(14px + 8px);
      left: clamp(10px, 3vw, 16px);
      right: clamp(10px, 3vw, 16px);
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
      z-index: 6;
    }

    .hud-plank {
      display: flex; align-items: center; gap: 9px;
      border-radius: 15px;
      padding: clamp(5px, 1.2vh, 8px) clamp(12px, 3.5vw, 18px);
    }
    .hud-plank svg { width: clamp(20px, 6vw, 26px); height: clamp(20px, 6vw, 26px); }
    .hud-plank span {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(18px, 5vw, 24px);
      color: var(--cream);
      text-shadow: 0 2px 0 rgba(70,40,15,.45);
      letter-spacing: 1px;
      min-width: 2ch;
    }

    .hud-right { display: flex; align-items: center; gap: 10px; pointer-events: auto; }

    .hud-timer {
      width: clamp(42px, 11vw, 50px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(17px, 4.8vw, 22px);
      color: var(--cream);
      text-shadow: 0 2px 0 rgba(70,40,15,.45);
    }
    .hud-timer.warn {
      background: #e8543f;
      animation: pulseWarn 1s ease-in-out infinite;
    }
    @keyframes pulseWarn {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    /* ============ OVERLAYS ============ */
    .overlay-screen {
      position: fixed; inset: 0;
      background: rgba(24,44,22,.55);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: clamp(16px, 5vw, 28px);
      opacity: 0; visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }
    .overlay-screen.active { opacity: 1; visibility: visible; }

    .popup-box {
      position: relative;
      width: 100%;
      max-width: 360px;
      padding: clamp(24px, 6.5vw, 34px) clamp(18px, 5vw, 28px) clamp(22px, 5.5vw, 30px);
      border-radius: 26px;
      text-align: center;
      transform: scale(.8);
      transition: transform .3s cubic-bezier(.175,.885,.32,1.275);
    }
    .overlay-screen.active .popup-box { transform: scale(1); }

    .panel-leaf {
      position: absolute; top: -18px; left: -16px;
      width: 58px; height: 58px;
      transform: rotate(-18deg);
      z-index: 1;
    }

    .end-title {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(26px, 8vw, 38px);
      color: var(--gold);
      letter-spacing: 1px;
      text-shadow:
        -2px -2px 0 var(--wood-outline), 2px -2px 0 var(--wood-outline),
        -2px 2px 0 var(--wood-outline), 2px 2px 0 var(--wood-outline),
        0 4px 0 rgba(70,40,15,.35);
      margin-bottom: clamp(6px, 1.5vh, 12px);
      line-height: 1.1;
    }
    .end-title.plain { color: var(--cream); }

    .end-score {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(46px, 15vw, 66px);
      color: var(--cream);
      line-height: 1;
      letter-spacing: 2px;
      text-shadow:
        -2px -2px 0 var(--wood-outline), 2px -2px 0 var(--wood-outline),
        -2px 2px 0 var(--wood-outline), 2px 2px 0 var(--wood-outline),
        0 6px 0 rgba(70,40,15,.35);
      margin-bottom: clamp(3px, 1vh, 6px);
    }

    .end-sub {
      font-size: clamp(13px, 3.6vw, 15px);
      font-weight: 500;
      color: rgba(255,246,223,.88);
      margin-bottom: clamp(10px, 2vh, 16px);
    }

    .best-chip {
      display: inline-block;
      background: var(--parchment);
      border: 3px solid var(--wood-outline);
      border-radius: 999px;
      padding: 4px 16px 3px;
      font-weight: 600;
      font-size: clamp(12px, 3.4vw, 14px);
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(70,40,15,.22);
      margin-bottom: clamp(10px, 2vh, 16px);
    }

    .new-best {
      display: none;
      align-items: center; justify-content: center; gap: 6px;
      background: var(--leaf);
      border: 3px solid var(--wood-outline);
      color: var(--cream);
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(13px, 3.8vw, 16px);
      letter-spacing: 1px;
      border-radius: 999px;
      padding: 5px 16px 4px;
      box-shadow: 0 3px 0 rgba(70,40,15,.30);
      margin: 0 auto clamp(10px, 2vh, 16px);
      width: fit-content;
      animation: wiggle .6s ease-in-out infinite;
    }
    .new-best.show { display: flex; }
    .new-best svg { width: 14px; height: 14px; fill: var(--gold); }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50%      { transform: rotate(3deg); }
    }

    .btn-group { display: flex; gap: 12px; justify-content: center; width: 100%; }
    .btn-stack { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .btn-action {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(15px, 4.4vw, 18px);
      letter-spacing: 1px;
      padding: clamp(11px, 2.2vh, 15px) 10px clamp(9px, 2vh, 13px);
      border-radius: 16px;
      border: 3px solid var(--wood-outline);
      cursor: pointer;
      box-shadow: 0 5px 0 var(--wood-outline), inset 0 3px 0 rgba(255,255,255,.25);
      transition: transform .08s, box-shadow .08s;
    }
    .btn-action svg { width: 1em; height: 1em; }
    .btn-action:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--wood-outline), inset 0 3px 0 rgba(255,255,255,.25);
    }
    .btn-wood  {
      background:
        repeating-linear-gradient(92deg, rgba(80,45,15,.10) 0 3px, transparent 3px 16px),
        linear-gradient(180deg, var(--wood-light), var(--wood-mid));
      color: var(--cream);
      text-shadow: 0 2px 0 rgba(70,40,15,.40);
    }
    .btn-green { background: var(--leaf); color: var(--cream); text-shadow: 0 2px 0 rgba(46,107,58,.55); }
    .btn-red   { background: #e8543f; color: var(--cream); text-shadow: 0 2px 0 rgba(140,40,25,.5); }
    .btn-plain { background: var(--parchment); color: var(--ink); }

    .popup-icon {
      width: clamp(54px, 15vw, 64px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffe3da;
      border: 3px solid var(--wood-outline);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto clamp(10px, 2vh, 15px);
      box-shadow: 0 4px 0 rgba(70,40,15,.25);
    }
    .popup-icon svg { width: 48%; height: 48%; stroke: #b03a24; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ============ SETTINGS PANEL ============ */
    .panel-slide {
      position: fixed;
      top: 0; right: -100%;
      width: min(86vw, 340px);
      height: 100%;
      z-index: 200;
      display: flex; flex-direction: column;
      transition: right .3s ease;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      border-left: 4px solid var(--wood-outline);
      box-shadow: -10px 0 24px rgba(30,20,8,.25);
    }
    .panel-slide::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(180deg, #b08149 0 9px, #8a5a2e 9px 18px);
      border-right: 3px solid var(--wood-outline);
    }
    .panel-slide.active { right: 0; }

    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: clamp(16px, 3.2vh, 24px) clamp(18px, 5vw, 24px) clamp(12px, 2.4vh, 18px) clamp(26px, 7vw, 34px);
      border-bottom: 3px solid rgba(70,40,15,.30);
    }
    .panel-title {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(22px, 6.5vw, 28px);
      color: var(--cream);
      letter-spacing: 1px;
      text-shadow: 0 2px 0 rgba(70,40,15,.45);
    }

    .panel-body { flex: 1; overflow-y: auto; padding-top: clamp(12px, 2.4vh, 20px); }

    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--parchment);
      border: 3px solid #cfa76a;
      border-radius: 16px;
      padding: clamp(10px, 2vh, 14px) clamp(12px, 3.5vw, 16px);
      margin: 0 clamp(16px, 4.5vw, 22px) clamp(10px, 1.8vh, 14px) clamp(26px, 7.5vw, 34px);
      box-shadow: 0 3px 0 rgba(70,40,15,.18);
    }
    .setting-row .row-label { display: flex; align-items: center; gap: 12px; }
    .setting-row .row-name { font-weight: 600; color: var(--ink); font-size: clamp(15px, 4.2vw, 16px); }

    .row-icon {
      width: clamp(38px, 10.5vw, 44px);
      aspect-ratio: 1;
      border-radius: 12px;
      background: var(--leaf);
      border: 3px solid var(--wood-outline);
      display: grid; place-items: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.30);
    }
    .row-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .row-icon.gold { background: var(--gold); color: #8a5a00; }
    .row-icon.red  { background: #e8543f; }

    .setting-row.danger {
      background: #ffe3da;
      border-color: #e8a08e;
      cursor: pointer;
    }
    .setting-row.danger:active { transform: scale(.98); }
    .danger-text { text-align: left; }
    .danger-text .d-name { font-weight: 700; color: #c0392b; font-size: clamp(15px, 4.2vw, 16px); }
    .danger-text .d-sub { font-size: 12px; color: #a4675a; }

    .toggle-sw {
      width: 54px; height: 30px;
      background: #c9b08a;
      border: 3px solid var(--wood-outline);
      border-radius: 100px;
      position: relative;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    .toggle-sw::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: #fff;
      border: 2px solid var(--wood-outline);
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: transform .2s;
      box-shadow: 0 2px 3px rgba(70,40,15,.25);
    }
    .toggle-sw.active { background: var(--leaf); }
    .toggle-sw.active::after { transform: translateX(24px); }

    .divider {
      margin: clamp(14px, 2.6vh, 22px) clamp(26px, 7.5vw, 34px) clamp(12px, 2.2vh, 18px);
      border-top: 3px dashed rgba(70,40,15,.30);
    }

    /* ============ FX ============ */
    .pop-effect {
      position: fixed;
      z-index: 150;
      pointer-events: none;
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(20px, 6vw, 28px);
      letter-spacing: 1px;

        -2px -2px 0 var(--wood-outline), 2px -2px 0 var(--wood-outline),

        0 4px 0 rgba(70,40,15,.30);
      animation: popUp .7s ease-out forwards;
    }
    @keyframes popUp {

      30%  { transform: translate(-50%, -95%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -165%) scale(1); opacity: 0; }
    }

    .save-indicator {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 18px);
      left: 50%;
      transform: translateX(-50%);
      background:
        repeating-linear-gradient(92deg, rgba(80,45,15,.10) 0 3px, transparent 3px 16px),

      padding: 7px 18px 6px;

      font-weight: 600;
      text-shadow: 0 1px 0 rgba(70,40,15,.4);
      opacity: 0;
      transition: opacity .3s;
      z-index: 1000;
      box-shadow: 0 4px 0 rgba(70,40,15,.3);
    }
    .save-indicator.show { opacity: 1; }

    /* ============ RESPONSIVE GUARDS ============ */

      .game-title { font-size: clamp(26px, 8vw, 40px); }
    }

  <script>
    // =====================================================
    // PERSISTENT COIN SYSTEM (unchanged logic)
    // =====================================================

    const STORAGE_KEY = 'coinRush_premium_v1';
    const BACKUP_KEY = 'coinRush_premium_backup_v1';

    let gameData = { coins: 0, best: 0, lastSaved: null, version: 1 };

    const saveIndicator = document.getElementById('saveIndicator');

    function saveCoins() {
      try {
        localStorage.setItem(BACKUP_KEY, localStorage.getItem(STORAGE_KEY));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameData));
        gameData.lastSaved = new Date().toISOString();
        showSaveIndicator();
        return true;
      } catch (error) {
        showSaveIndicator('Save Failed!');
        return false;
      }
    }

    function loadBackup() {
      try {
        const backup = localStorage.getItem(BACKUP_KEY);
        if (backup) {
          const parsed = JSON.parse(backup);
          if (typeof parsed.coins === 'number' && parsed.coins >= 0) {
            gameData = parsed;
            saveCoins();
            return true;
          }
        }
      } catch (e) {}
      gameData = { coins: 0, best: 0, lastSaved: null, version: 1 };
      saveCoins();
      return false;
    }

    function loadCoins() {
      try {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
          const parsed = JSON.parse(savedData);
          if (typeof parsed.coins === 'number' && parsed.coins >= 0) {
            gameData = parsed;
            if (typeof gameData.best !== 'number') gameData.best = 0;
            return true;
          }
          return loadBackup();
        }
        saveCoins();
        return false;
      } catch (error) {
        return loadBackup();
      }
    }

    function addCoins(amount) {
      if (typeof amount !== 'number' || amount < 0) return false;
      gameData.coins += amount;
      updateWalletDisplay();
      saveCoins();
      return true;
    }

    function resetCoins() {
      gameData.coins = 0;
      updateWalletDisplay();
      saveCoins();
    }

    function showSaveIndicator(msg = 'Progress Saved') {
      saveIndicator.textContent = msg;
      saveIndicator.classList.add('show');
      setTimeout(() => saveIndicator.classList.remove('show'), 1500);
    }

    function updateWalletDisplay() {
      const el = document.getElementById('homeWallet');
      if (el) el.textContent = gameData.coins.toLocaleString();
    }

    // =====================================================
    // AUDIO (SFX + gentle jungle marimba loop)
    // =====================================================

    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    function playSound(type) {
      if (!ensureAudio()) return;
      if (!state.sfx && type !== 'click') return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'collect') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(620, now);
          osc.frequency.exponentialRampToValueAtTime(1240, now + 0.1);
          g.gain.setValueAtTime(0.10, now);
          g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'click') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.linearRampToValueAtTime(100, now + 0.05);
          g.gain.setValueAtTime(0.05, now);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'end') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(100, now + 0.4);
          g.gain.setValueAtTime(0.13, now);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    // Soft ambient marimba loop (pentatonic) — driven by the Music toggle
    const music = { timer: null, step: 0, notes: [261.63, 329.63, 392.00, 523.25, 587.33, 523.25, 392.00, 329.63] };

    function playNote(freq) {
      try {
        const osc = audioCtx.createOscillator();
        const f = audioCtx.createBiquadFilter();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        f.type = 'lowpass'; f.frequency.value = 1400;
        osc.connect(f); f.connect(g); g.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.045, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        osc.start(now); osc.stop(now + 0.55);
      } catch (e) {}
    }

    function startMusic() {
      if (music.timer || !state.music) return;
      if (!ensureAudio()) return;
      music.timer = setInterval(() => {
        if (!state.music) return;
        playNote(music.notes[music.step % music.notes.length]);
        music.step++;
      }, 480);
    }
    function stopMusic() {
      if (music.timer) { clearInterval(music.timer); music.timer = null; }
    }

    // =====================================================
    // GAME ENGINE
    // =====================================================

    const $ = (id) => document.getElementById(id);
    const TAU = Math.PI * 2;

    const state = { score: 0, time: 60, maxTime: 60, playing: false, paused: false, sfx: true, music: true, vib: true };

    const canvas = $('gameCanvas');
    const ctx = canvas.getContext('2d');
    const progressBar = $('progressBar');
    const hudScore = $('hudScore');
    const hudTime = $('hudTime');

    let viewW = 0, viewH = 0, skyGrad = null;
    let coins = [], sparkles = [], ambient = [];
    let animationId = null, timerInterval = null;

    function setupCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const rect = canvas.getBoundingClientRect();
      viewW = rect.width; viewH = rect.height;
      canvas.width = Math.max(1, Math.round(viewW * dpr));
      canvas.height = Math.max(1, Math.round(viewH * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      skyGrad = null;
      coins.forEach(c => { c.x = Math.min(Math.max(c.x, c.r + 4), Math.max(viewW - c.r - 4, c.r + 4)); });
    }

    // ---------- drawing helpers ----------
    function leafPath(c, s) {
      c.beginPath();
      c.moveTo(0, 0);
      c.bezierCurveTo(s * 0.55, -s * 0.25, s * 0.6, -s * 0.95, 0, -s * 1.5);
      c.bezierCurveTo(-s * 0.6, -s * 0.95, -s * 0.55, -s * 0.25, 0, 0);
      c.closePath();
    }
    function drawLeaf(x, y, ang, s, fill, stroke) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      leafPath(ctx, s);
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = Math.max(1.5, s * 0.15);
      ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.restore();
    }
    function qPoint(p0, c, p1, t) {
      const u = 1 - t;
      return { x: u * u * p0.x + 2 * u * t * c.x + t * t * p1.x, y: u * u * p0.y + 2 * u * t * c.y + t * t * p1.y };
    }
    function bumpLayer(yBase, amp, color, off, outline) {
      ctx.beginPath();
      ctx.moveTo(-30, viewH + 30); ctx.lineTo(-30, yBase);
      const n = 7, step = (viewW + 60) / n;
      for (let i = 0; i < n; i++) {
        const x0 = -30 + i * step;
        const h = amp * (i % 2 === 0 ? 1 : 0.72) + (i % 3 === 0 ? amp * 0.2 : 0);
        ctx.quadraticCurveTo(x0 + step * 0.5 + off, yBase - h * 2, x0 + step, yBase);
      }
      ctx.lineTo(viewW + 30, viewH + 30); ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke(); }
    }

    function drawBackground(t) {
      if (!skyGrad) {
        skyGrad = ctx.createLinearGradient(0, 0, 0, viewH);
        skyGrad.addColorStop(0, '#e3f4c9');
        skyGrad.addColorStop(1, '#a9dd8c');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, viewW, viewH);

      // Cartoon sun
      const sr = Math.min(viewW, viewH) * 0.065;
      const sx = viewW * 0.80, sy = viewH * 0.17;
      ctx.save();
      ctx.translate(sx, sy); ctx.rotate(t * 0.15);
      ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = sr * 0.22; ctx.lineCap = 'round';
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * sr * 1.4, Math.sin(a) * sr * 1.4);
        ctx.lineTo(Math.cos(a) * sr * 1.8, Math.sin(a) * sr * 1.8);
        ctx.stroke();
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU);
      ctx.fillStyle = '#fff0a8'; ctx.fill();
      ctx.lineWidth = sr * 0.16; ctx.strokeStyle = '#f2cf5b'; ctx.stroke();

      // Hanging vines from the canopy
      const vineDefs = [
        { fx: 0.16, len: 0.20, ph: 0 },
        { fx: 0.50, len: 0.15, ph: 2 },
        { fx: 0.84, len: 0.24, ph: 4 }
      ];
      const vw = Math.max(4, viewW * 0.011);
      vineDefs.forEach(v => {
        const bx = v.fx * viewW, len = v.len * viewH;
        const sway = Math.sin(t * 0.8 + v.ph) * 9;
        const p0 = { x: bx, y: -5 };
        const cp = { x: bx + sway * 0.4, y: len * 0.55 };
        const p1 = { x: bx + sway, y: len };
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y);
        ctx.quadraticCurveTo(cp.x, cp.y, p1.x, p1.y);
        ctx.strokeStyle = '#3e8f3e'; ctx.lineWidth = vw; ctx.lineCap = 'round'; ctx.stroke();
        [[0.35, -0.9], [0.65, 0.9], [1.0, -0.7]].forEach(([lt, side], li) => {
          const pt = qPoint(p0, cp, p1, lt);
          drawLeaf(pt.x, pt.y, side * 1.15 + Math.sin(t + v.ph + li) * 0.08, vw * 2.6, '#57b567', '#2e6b3a');
        });
      });

      // Jungle floor
      bumpLayer(viewH * 0.88, viewH * 0.055, '#8fcf78', 0, null);
      const sway = Math.sin(t * 0.6) * 5;
      bumpLayer(viewH * 0.955, viewH * 0.06, '#5fae57', sway, '#3e8f3e');
    }

    function initAmbient() {
      ambient = [];
      const cols = ['#57b567', '#3f8f3f', '#6fc46f'];
      for (let i = 0; i < 6; i++) {
        ambient.push({
          x: Math.random() * viewW, y: Math.random() * viewH,
          vy: 0.35 + Math.random() * 0.4, ph: Math.random() * TAU,
          rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.03,
          s: 8 + Math.random() * 7,
          color: cols[i % 3]
        });
      }
    }

    function updateAmbient(dt) {
      ambient.forEach(l => {
        l.y += l.vy;
        l.x += Math.sin(l.y * 0.02 + l.ph) * 0.5;
        l.rot += l.vr;
        if (l.y > viewH + 24) { l.y = -20; l.x = Math.random() * viewW; }
      });
    }

    // ---------- coins ----------
    class Coin {
      constructor() { this.reset(true); }

      reset(initial = false) {
        const s = Math.min(viewW, viewH) / 375;
        this.r = Math.min(36, Math.max(14, (16 + Math.random() * 16) * s));
        this.x = this.r + 4 + Math.random() * Math.max(1, viewW - this.r * 2 - 8);
        this.y = initial ? Math.random() * viewH : -this.r - 8;
        this.speed = (viewH / 640) * (1.6 + Math.random() * 2.2);
        this.value = this.r > 27 * s ? 5 : this.r > 22 * s ? 2 : 1;
        this.angle = Math.random() * TAU;
        this.spin = 0.02 + Math.random() * 0.03;
        this.wob = Math.random() * TAU;

        if (this.value === 5)      { this.body = '#ff7a5c'; this.rim = '#cf4a2e'; this.ring = '#ff9d82'; this.ink = '#8e2c14'; }
        else if (this.value === 2) { this.body = '#52c98f'; this.rim = '#23955f'; this.ring = '#7fdcb2'; this.ink = '#0e5c3a'; }
        else                       { this.body = '#ffd34e'; this.rim = '#d9990f'; this.ring = '#ffe38f'; this.ink = '#8a5a00'; }
      }

      update() {
        this.y += this.speed;
        this.wob += this.spin;
        if (this.y > viewH + this.r + 10) this.reset();
      }

      draw() {
        const r = this.r;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.sin(this.wob) * 0.3);

        // soft shadow behind
        ctx.beginPath(); ctx.arc(0, 3, r, 0, TAU);
        ctx.fillStyle = 'rgba(70,40,15,.16)'; ctx.fill();

        // body
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
        ctx.fillStyle = this.body; ctx.fill();
        ctx.lineWidth = Math.max(2.5, r * 0.14); ctx.strokeStyle = this.rim; ctx.stroke();

        // inner ring
        ctx.beginPath(); ctx.arc(0, 0, r * 0.74, 0, TAU);
        ctx.lineWidth = Math.max(1.5, r * 0.07); ctx.strokeStyle = this.ring; ctx.stroke();

        // shine
        ctx.beginPath(); ctx.arc(0, 0, r * 0.60, Math.PI * 1.08, Math.PI * 1.5);
        ctx.lineWidth = r * 0.12; ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();

        // face
        const es = Math.max(1.6, r * 0.11);
        ctx.fillStyle = '#5b3a1e';
        ctx.beginPath();
        ctx.arc(-r * 0.30, -r * 0.12, es, 0, TAU);
        ctx.arc(r * 0.30, -r * 0.12, es, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-r * 0.30 + es * 0.35, -r * 0.12 - es * 0.35, es * 0.4, 0, TAU);
        ctx.arc(r * 0.30 + es * 0.35, -r * 0.12 - es * 0.35, es * 0.4, 0, TAU);
        ctx.fill();
        // smile
        ctx.beginPath(); ctx.arc(0, r * 0.02, r * 0.28, Math.PI * 0.15, Math.PI * 0.85);
        ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.lineCap = 'round';
        ctx.strokeStyle = '#5b3a1e'; ctx.stroke();
        // blush
        ctx.fillStyle = 'rgba(255,120,90,.35)';
        ctx.beginPath();
        ctx.arc(-r * 0.52, r * 0.14, r * 0.13, 0, TAU);
        ctx.arc(r * 0.52, r * 0.14, r * 0.13, 0, TAU);
        ctx.fill();
        // value
        ctx.font = `700 ${Math.max(9, r * 0.42)}px Fredoka, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = this.ink;
        ctx.fillText(this.value, 0, r * 0.52);

        ctx.restore();
      }

      checkHit(mx, my) {
        return Math.sqrt((mx - this.x) ** 2 + (my - this.y) ** 2) < this.r * 1.05;
      }
    }

    // ---------- collect sparkles ----------
    class Sparkle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 9;
        this.vy = (Math.random() - 0.5) * 9 - 2;
        this.life = 1;
        this.size = 3 + Math.random() * 5;
        this.rot = Math.random() * TAU;
        this.vr = (Math.random() - 0.5) * 0.3;
        this.color = Math.random() < 0.35 ? '#fff6df' : color;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.22;
        this.rot += this.vr;
        this.life -= 0.045;
      }
      draw() {
        if (this.life <= 0) return;
        const s = this.size * this.life;
        ctx.save();
        ctx.translate(this.x, this.y); ctx.rotate(this.rot);
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.quadraticCurveTo(s * 0.25, -s * 0.25, s, 0);
        ctx.quadraticCurveTo(s * 0.25, s * 0.25, 0, s);
        ctx.quadraticCurveTo(-s * 0.25, s * 0.25, -s, 0);
        ctx.quadraticCurveTo(-s * 0.25, -s * 0.25, 0, -s);
        ctx.fillStyle = this.color; ctx.fill();
        ctx.restore();
      }
    }

    // ---------- game flow ----------
    function initGame() {
      state.score = 0;
      state.time = state.maxTime;
      state.playing = true;
      state.paused = false;

      setupCanvas();
      initAmbient();

      coins = [];
      sparkles = [];
      const target = Math.round(Math.min(16, Math.max(7, (viewW * viewH) / 26000)));
      for (let i = 0; i < target; i++) coins.push(new Coin());

      hudScore.textContent = '0';
      hudTime.textContent = state.time;
      hudTime.classList.remove('warn');
      updateProgressBar();

      $('endOverlay').classList.remove('active');
      $('pauseOverlay').classList.remove('active');

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!state.paused && state.playing) {
          state.time--;
          hudTime.textContent = Math.max(0, state.time);
          hudTime.classList.toggle('warn', state.time <= 10);
          updateProgressBar();
          if (state.time <= 0) endGame();
        }
      }, 1000);

      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    function updateProgressBar() {
      progressBar.style.transform = `scaleX(${Math.max(0, state.time / state.maxTime)})`;
    }

    function loop(ts) {
      if (!state.playing) return;
      const t = (ts || 0) / 1000;

      if (!state.paused) {
        ctx.clearRect(0, 0, viewW, viewH);
        drawBackground(t);
        updateAmbient();
        ambient.forEach(l => drawLeaf(l.x, l.y, l.rot, l.s, l.color, '#2e6b3a'));
        coins.forEach(c => { c.update(); c.draw(); });
        sparkles = sparkles.filter(p => p.life > 0);
        sparkles.forEach(p => { p.update(); p.draw(); });
      }

      animationId = requestAnimationFrame(loop);
    }

    function handleTap(e) {
      e.preventDefault();
      if (!state.playing || state.paused) return;
      ensureAudio();

      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      const mx = clientX - rect.left;
      const my = clientY - rect.top;

      coins.forEach(c => {
        if (c.checkHit(mx, my)) {
          state.score += c.value;
          hudScore.textContent = state.score;
          playSound('collect');

          createPop(clientX, clientY, c.value, c.value === 1 ? '#ffd34e' : c.value === 2 ? '#52c98f' : '#ff7a5c');

          for (let i = 0; i < 10; i++) sparkles.push(new Sparkle(c.x, c.y, c.body));

          if (state.vib && navigator.vibrate) navigator.vibrate(30);

          c.reset();
        }
      });
    }

    function createPop(x, y, val, color) {
      const el = document.createElement('div');
      el.className = 'pop-effect';
      el.textContent = '+' + val;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.color = color;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function stopGame() {
      state.playing = false;
      state.paused = false;
      cancelAnimationFrame(animationId);
      if (timerInterval) clearInterval(timerInterval);
    }

    function setPaused(p) {
      state.paused = p;
      $('pauseOverlay').classList.toggle('active', p);
    }

    function endGame() {
      stopGame();
      playSound('end');

      const isBest = state.score > (gameData.best || 0);
      if (isBest) gameData.best = state.score;
      if (state.score > 0) addCoins(state.score);

      $('endScore').textContent = state.score;
      $('endBest').textContent = 'BEST ' + (gameData.best || 0);
      $('newBest').classList.toggle('show', isBest && state.score > 0);
      $('endOverlay').classList.add('active');
    }

    function goHome() {
      stopGame();
      $('endOverlay').classList.remove('active');
      $('pauseOverlay').classList.remove('active');
      $('gameScreen').classList.remove('active');
      $('homeScreen').classList.add('active');
      updateWalletDisplay();
    }

    // =====================================================
    // EVENTS & NAVIGATION
    // =====================================================

    $('btnPlay').addEventListener('click', () => {
      playSound('click');
      ensureAudio();
      if (state.music) startMusic();
      $('homeScreen').classList.remove('active');
      $('gameScreen').classList.add('active');
      setTimeout(initGame, 120);
    });

    $('btnSettings').addEventListener('click', () => {
      playSound('click');
      $('settingsPanel').classList.add('active');
    });

    $('btnCloseSettings').addEventListener('click', () => {
      playSound('click');
      $('settingsPanel').classList.remove('active');
    });

    $('btnPause').addEventListener('click', () => {
      if (!state.playing) return;
      playSound('click');
      setPaused(true);
    });
    $('btnResume').addEventListener('click', () => { playSound('click'); setPaused(false); });
    $('btnRestart').addEventListener('click', () => { playSound('click'); initGame(); });
    $('btnHome2').addEventListener('click', () => { playSound('click'); goHome(); });

    $('btnRetry').addEventListener('click', () => {
      playSound('click');
      $('endOverlay').classList.remove('active');
      initGame();
    });

    $('btnHome').addEventListener('click', () => { playSound('click'); goHome(); });

    $('btnResetCoins').addEventListener('click', () => {
      playSound('click');
      $('settingsPanel').classList.remove('active');
      $('confirmOverlay').classList.add('active');
    });

    $('btnCancelReset').addEventListener('click', () => {
      playSound('click');
      $('confirmOverlay').classList.remove('active');
    });

    $('btnConfirmReset').addEventListener('click', () => {
      playSound('click');
      resetCoins();
      $('confirmOverlay').classList.remove('active');
      showSaveIndicator('Coins Reset!');
    });

    function setupToggle(id, key) {
      $(id).addEventListener('click', function () {
        state[key] = !state[key];
        this.classList.toggle('active');
        playSound('click');
        if (key === 'music') { state.music ? startMusic() : stopMusic(); }
      });
    }
    setupToggle('toggleSfx', 'sfx');
    setupToggle('toggleMusic', 'music');
    setupToggle('toggleVib', 'vib');

    canvas.addEventListener('mousedown', handleTap);
    canvas.addEventListener('touchstart', handleTap, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // Unlock audio + start ambience on first interaction
    document.addEventListener('pointerdown', () => {
      ensureAudio();
      if (state.music) startMusic();
    }, { once: true });

    // Responsive canvas / orientation changes
    function onResize() {
      if ($('gameScreen').classList.contains('active') && state.playing) setupCanvas();
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

    // Init
    loadCoins();
    updateWalletDisplay();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveCoins();
        if (state.playing && !state.paused) setPaused(true);
      }
    });
    window.addEventListener('pagehide', saveCoins);
  </script>
</body>
</html>
